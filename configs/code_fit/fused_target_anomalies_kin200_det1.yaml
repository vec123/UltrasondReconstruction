# Fit the code of the frozen full313 kin200 det1 flow to every fused scan of
# fused_scans_anomalies (the anomaly sessions of configs/pipelines/gen_fused_scan_targets_anomalies.yaml),
# with the settings of fused_target.yaml. The scans keep their own point count and their
# frame: the aligned baby mean of the Casos_Mar cohort is the run's template moved into the
# scans' frame (the run's similarity.json maps one onto the other).
#
# Run with:
#    python scripts/run.py configs/code_fit/fused_target_anomalies_kin200_det1.yaml
# One session alone:
#    python scripts/run.py configs/code_fit/fused_target_anomalies_kin200_det1.yaml \
#        --case '{"SUBJECT_ID": "T21-474272", "WEEK": "20 semanas"}'
stage: code_fit
extends: code_fit/fused_target.yaml

variables:
  RUN: ${PROJECT_ROOT}/outputs/direct_flow/timevarying-mlp2x128-kin200-det1_code128_codereg0.01_edgeweight3sp-template2scan_full313_train281
  ANOMALIES: ${DATA_ROOT}/fused_scans_anomalies
  FUSED_SCAN: ${ANOMALIES}/${SESSION}/fused_scan_ssm/fused_scan.vtp

# SUBJECT_ID and WEEK are the parts that the pattern finds.
targets:
  match: ${ANOMALIES}/${SUBJECT_ID}/${WEEK}/fused_scan_ssm/fused_scan.vtp

batch:
  workers: 1
  log_dir: ${ANOMALIES}/batch_logs_code_fit
  skip_if_exists: ${PROJECT_ROOT}/outputs/direct_flow/timevarying-mlp2x128-kin200-det1_code128_codereg0.01_edgeweight3sp-template2scan_full313_train281_anomalies_code_fit/${SESSION}

paths:
  target: ${FUSED_SCAN}
  output_dir: ${PROJECT_ROOT}/outputs/direct_flow/timevarying-mlp2x128-kin200-det1_code128_codereg0.01_edgeweight3sp-template2scan_full313_train281_anomalies_code_fit/${SESSION}
  frame: {aligned_template: '${PROJECT_ROOT}/outputs/Casos_Mar/cohort/template_baby_mean_aligned.vtp'}

hyperparameters:
  model: {run: '${RUN}'}
