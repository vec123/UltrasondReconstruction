# Stage 1: raw NRRD ultrasound volumes -> cleaned surface meshes (VTP).
# This stage's output mesh is the pipeline's "original frame" - every later
# alignment stage's saved transform maps back to this coordinate space.
stage: nrrd_to_vtp

# The case for a run of this file alone (python scripts/run.py <this file>).
variables:
  DATASET: Casos_Mar
  CASES_ROOT: /home/victor/Projects/UltrasoundLandmarkPredictor/results/inference/Casos_Mar
  SUBJECT_ID: 1
  WEEK: 20 semanas

# Only for a run of this file alone: a pipeline that names it with `config:` gives its own paths.
paths:
  input_dir: ${SCANS_DIR}
  output_dir: ${OUT}/${SESSION}
  cache_dir: ${OUT}/${SESSION}/Cache

# What a pipeline takes over with `config: ultrasound/stages/01_nrrd_to_vtp.yaml`.
hyperparameters:
  contour_value: 70  # level relative to volume.norm_out_max after normalization; ignored if auto_contour
  auto_contour: false  # pick contour_value per volume via Otsu's method - set true when mixing NRRD sources with different intensity scales
  reduction_factor: 0.1  # quadric decimation factor (0 = none, 0.5 = 50% reduction)
  min_bridge_width: 0  # bridges narrower than this do not connect regions; 0 disables
  min_bridge_relative: false
  compute_curvedness: false
  curvedness_n_rings: 5
  curvedness_scale_invariant: false
  operators: false  # compute Laplace-Beltrami operators (k_eig eigenpairs); slow
  k_eig: 200
  flat:
    enabled: false
    n_rings: 5
    thresh: 0.1
    max_area: 0.05
  volume:
    denoise: null
    denoise_radius: 5
    normalize: false
    clip_percentiles: [1.0, 99.0]
    norm_out_max: 255.0
    crop: false
    crop_threshold: 0
    crop_margin: 0
    four_d: skip  # 4D (x, y, z, t) volumes: skip (with a warning) | mean | median | <frame index>
