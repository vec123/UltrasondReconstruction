# Stage 2: align every subject's mesh + landmarks onto one reference subject.
# First alignment stage in the chain -> previous_transforms_dir is null; the
# transform saved here IS the cumulative (original-frame -> this stage) one.
stage: align_to_reference

# The case for a run of this file alone (python scripts/run.py <this file>).
variables:
  CASES_ROOT: /home/victor/Projects/UltrasoundLandmarkPredictor/results/inference/Casos_Mar
  SUBJECT_ID: 1
  WEEK: 20 semanas
  REFERENCE_SCAN: 1-20s-01
  LANDMARKS_FRAME: LPS

# Only for a run of this file alone: a pipeline that names it with `config:` gives its own paths.
paths:
  landmarks_csv_dir: ${CASES_ROOT}/${SUBJECT_ID}/${WEEK}/LMKS
  vtp_shapes_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}
  output_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned
  raw_landmarks_vtp_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/raw_landmarks_vtp
  transforms_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned/transforms
  previous_transforms_dir: null
  aligned_shapes_vtp_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned/aligned_shapes_vtp
  aligned_landmarks_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned/aligned_landmarks

# What a pipeline takes over with `config: ultrasound/stages/02_align_to_reference.yaml`.
hyperparameters:
  reference_subject_id: ${REFERENCE_SCAN}  # scan every other scan is aligned onto; the REFERENCE_SCAN paths read its outputs
  with_scale: true
  landmarks_frame: ${LANDMARKS_FRAME}  # frame the landmark CSVs are written in: Lmks_Antonia (subjects 1, 2, 14) is RAS, 9992's Lmks is LPS, 9999's LMKS is RAS
