# vtp_to_nrrd_overlay (no base, so written out in full).
stage: vtp_to_nrrd_overlay

# The case for a run of this file alone (python scripts/run.py <this file>).
variables:
  CASES_ROOT: /home/victor/Projects/UltrasoundLandmarkPredictor/results/inference/Casos_Mar
  SUBJECT_ID: 1
  WEEK: 20 semanas
  REFERENCE_SCAN: 1-20s-01

# Only for a run of this file alone: a pipeline that names it gives its own paths.
paths:
  nrrd_path: ${CASES_ROOT}/${SUBJECT_ID}/${WEEK}/${REFERENCE_SCAN}.nrrd
  output_path: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_baby_ssm/${SUBJECT_ID}/${WEEK}/overlay/recon_overlay.nrrd
  label_maps_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_baby_ssm/${SUBJECT_ID}/${WEEK}/overlay/recon_overlay_labels
  layers:
  - vtp_path: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_baby_ssm/${SUBJECT_ID}/${WEEK}/apply/world/deformed.vtp
    name: Reconstruction (Baby SSM)
    line_color: [255, 255, 0]
    transform: {manifest_dir: '${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template/transforms', subject_id: '${REFERENCE_SCAN}',
      apply_inverse: true}
  - vtp_path: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_baby_mean/${SUBJECT_ID}/${WEEK}/apply/world/deformed.vtp
    name: Reconstruction (Baby Mean)
    line_color: [255, 165, 0]
    transform: {manifest_dir: '${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template/transforms', subject_id: '${REFERENCE_SCAN}',
      apply_inverse: true}
  - vtp_path: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_fetus_ssm/${SUBJECT_ID}/${WEEK}/apply/world/deformed.vtp
    name: Reconstruction (Fetus SSM)
    line_color: [0, 255, 255]
    transform: {manifest_dir: '${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template/transforms', subject_id: '${REFERENCE_SCAN}',
      apply_inverse: true}
  - vtp_path: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_fetus_mean/${SUBJECT_ID}/${WEEK}/apply/world/deformed.vtp
    name: Reconstruction (Fetus Mean)
    line_color: [255, 0, 255]
    transform: {manifest_dir: '${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template/transforms', subject_id: '${REFERENCE_SCAN}',
      apply_inverse: true}
  - vtp_path: ${PROJECT_ROOT}/outputs/Casos_Mar/fetus_ssm/${SUBJECT_ID}/${WEEK}/end_to_end/init_pca/nicp_refined_vertices_map_1x.vtp
    name: SSM Fit (Fetus init, PCA, MAP)
    line_color: [100, 180, 255]
    transform: {manifest_dir: '${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template/transforms', subject_id: '${REFERENCE_SCAN}',
      apply_inverse: true}
  - vtp_path: ${PROJECT_ROOT}/outputs/Casos_Mar/fetus_ssm/${SUBJECT_ID}/${WEEK}/end_to_end/init_pca/nicp_refined_vertices_p2plane_chamfer.vtp
    name: SSM Fit (Fetus init, PCA, P2Plane Chamfer)
    line_color: [0, 90, 200]
    transform: {manifest_dir: '${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template/transforms', subject_id: '${REFERENCE_SCAN}',
      apply_inverse: true}
  - vtp_path: ${PROJECT_ROOT}/outputs/Casos_Mar/fetus_ssm/${SUBJECT_ID}/${WEEK}/end_to_end/init_pca_times_gaussian/nicp_refined_vertices_map_1x.vtp
    name: SSM Fit (Fetus init, PCA x Gaussian, MAP)
    line_color: [120, 230, 230]
