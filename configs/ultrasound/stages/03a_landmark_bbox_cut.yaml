# Stage 3a: drop mesh points outside a box built from the landmarks' own
# bounding box. Coarse pre-filter meant to run before landmark_distance_cut
# (03b) - cheaper, and shrinks the point count landmark_distance_cut's
# per-point KD-tree query has to run over.
stage: landmark_bbox_cut

# The case for a run of this file alone (python scripts/run.py <this file>).
variables:
  DATASET: Casos_Mar
  SUBJECT_ID: 1
  WEEK: 20 semanas

# Only for a run of this file alone: a pipeline that names it with `config:` gives its own paths.
paths:
  shapes_dir: ${OUT}/${SESSION}/aligned_to_template/shapes_vtp
  landmarks_dir: ${OUT}/${SESSION}/aligned_to_template/landmarks_vtp
  output_dir: ${OUT}/${SESSION}/aligned_to_template/landmark_bbox_cut
  transforms_dir: ${OUT}/${SESSION}/aligned_to_template/transforms

# What a pipeline takes over with `config: ultrasound/stages/03a_landmark_bbox_cut.yaml`.
hyperparameters:
  x_min_offset_mm: 10.0
  x_max_offset_mm: 10.0
  y_min_offset_mm: 3.0
  y_max_offset_mm: 35.0
  z_min_offset_mm: 20.0  # inferior: generous, keeps more of the chin
  z_max_offset_mm: 5.0  # superior: strict, stays close above the eyes
  keep_largest_component: false  # re-extract the largest component after the box cut
  min_bridge_width: 0  # bridges narrower than this do not connect regions after the cut; 0 disables
  min_bridge_relative: false
