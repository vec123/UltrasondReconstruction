# Stage 4: score and denoise aligned meshes by cross-subject consistency.
# Doesn't move geometry, so it saves no transform - it only reads stage 3's
# transforms to convert sigma_mm into the aligned mesh's own units.
stage: scan_consistency

# The case for a run of this file alone (python scripts/run.py <this file>).
variables:
  DATASET: Casos_Mar
  SUBJECT_ID: 1
  WEEK: 20 semanas

# Only for a run of this file alone: a pipeline that names it with `config:` gives its own paths.
paths:
  input_aligned_dir: ${OUT}/${SESSION}/aligned_to_template/landmark_bbox_cut
  output_consistency_dir: ${OUT}/${SESSION}/consistency_shapes_vtp
  output_denoised_dir: ${OUT}/${SESSION}/consistency_thresholds
  output_merged_dir: ${OUT}/${SESSION}/merged_high_confidence_scan
  transforms_dir: ${OUT}/${SESSION}/aligned_to_template/transforms

# What a pipeline takes over with `config: ultrasound/stages/04_scan_consistency.yaml`.
hyperparameters:
  sigma_mm: 2.0  # spatial tolerance in mm; points within sigma_mm score highly
  apply_denoise_threshold: true
  min_consistency_threshold: [0.99, 0.9, 0.7, 0.8, 0.6, 0.5, 0.3, 0.2]
  denoise_min_bridge_width: 0
  denoise_min_bridge_relative: true
