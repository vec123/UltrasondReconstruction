# Stage 1b: attach a per-vertex roughness field to each mesh and threshold
# noisy/bumpy vertices away. Split out of nrrd_to_vtp so it can run
# standalone against any directory of .vtp meshes.
stage: roughness_filter

# The case for a run of this file alone (python scripts/run.py <this file>).
variables:
  DATASET: Casos_Mar
  SUBJECT_ID: 1
  WEEK: 20 semanas

# Only for a run of this file alone: a pipeline that names it with `config:` gives its own paths.
paths:
  input_dir: ${OUT}/${SESSION}/aligned_to_template/shapes_vtp
  output_dir: ${OUT}/${SESSION}/aligned_to_template/roughness_filtered
  unfiltered_dir: ${OUT}/${SESSION}/aligned_to_template/roughness_unfiltered
  transforms_dir: ${OUT}/${SESSION}/aligned_to_template/transforms

# What a pipeline takes over with `config: ultrasound/stages/01b_roughness_filter.yaml`.
hyperparameters:
  n_rings: 5
  scale_invariant: false
  method: quadric  # "plane" | "quadric"
  threshold: 0.9  # keep vertices with roughness below this fraction of the field's range
  neighbors: knn  # "knn" | "rings"
  max_neighbors: 32
  min_bridge_width: 0  # bridges narrower than this do not connect regions after thresholding; 0 disables
  min_bridge_relative: false
