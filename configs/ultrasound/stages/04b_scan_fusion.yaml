# Stage 4b: fuse every subject's aligned mesh into one consensus scan - a
# Gaussian-weighted, normal-aware average onto a fixed reference mesh's
# topology, instead of scan_consistency's raw union-of-points merge (which
# reads noisier than any one subject's own scan, since overlapping regions
# get several slightly-offset copies of the same patch layered on top of
# each other whenever alignment isn't pixel-perfect).
stage: scan_fusion

# The case for a run of this file alone (python scripts/run.py <this file>).
variables:
  DATASET: Casos_Mar
  SUBJECT_ID: 1
  WEEK: 20 semanas

# Only for a run of this file alone: a pipeline that names it with `config:` gives its own paths.
paths:
  input_aligned_dir: ${OUT}/${SESSION}/consistency_thresholds/threshold_0.6
  reference_vtp: ${OUT}/fetus_ssm/${SESSION}/end_to_end/init_pca/nicp_refined_vertices_map_1x.vtp
  output_dir: ${OUT}/fetus_ssm/${SESSION}/end_to_end/fused_scan_ssm
  transforms_dir: ${OUT}/${SESSION}/aligned_to_template/transforms

# What a pipeline takes over with `config: ultrasound/stages/04b_scan_fusion.yaml`.
hyperparameters:
  sigma_mm: 2  # spatial tolerance in mm; subject points within sigma_mm pull a reference vertex toward them
  min_support: 0.0001  # reference vertices with total kernel weight below this are dropped (too little cross-subject agreement)
  normal_power: 1
  surface_fit_n_rings: 5
  surface_fit_method: quadric  # "plane" | "quadric"
  compute_roughness: false
