# Stage 3: align every subject's mesh onto the fixed template's landmark space.
# The saved transform is composed with stage 2's, so it maps directly from
# the original (stage 1) mesh frame into template space.
stage: align_to_template

# The case for a run of this file alone (python scripts/run.py <this file>).
variables:
  SUBJECT_ID: 1
  WEEK: 20 semanas

# Only for a run of this file alone: a pipeline that names it with `config:` gives its own paths.
paths:
  template_vtp: ${PROJECT_ROOT}/assets/templates/fetus_mean.vtp
  vtp_shapes_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned/aligned_shapes_vtp
  landmarks_csv_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned/aligned_landmarks
  output_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template
  out_shapes_vtp_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template/shapes_vtp
  out_landmarks_vtp_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template/landmarks_vtp
  out_landmarks_csv_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template/landmarks_csv
  transforms_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned_to_template/transforms
  previous_transforms_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/${SUBJECT_ID}/${WEEK}/aligned/transforms

# What a pipeline takes over with `config: ultrasound/stages/03_align_to_template.yaml`.
hyperparameters:
  heatmap_prefix: heatmap_
  with_scale: true
  landmarks_frame: LPS  # frame the landmark CSVs are written in (RAS or LPS)
