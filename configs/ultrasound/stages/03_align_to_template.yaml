# Stage 3: align every subject's mesh onto the fixed template's landmark space.
# The saved transform is composed with stage 2's, so it maps directly from
# the original (stage 1) mesh frame into template space.
stage: align_to_template

template_vtp: ${PROJECT_ROOT}/scripts/US/mean_shape/model_space/mean_shape.vtp
vtp_shapes_dir: ${PROJECT_ROOT}/US_samples/VTP_Casos_Mar/US_samples_fetusnet_full/prepared/1/nrrd/aligned/aligned_shapes_vtp
landmarks_csv_dir: ${PROJECT_ROOT}/US_samples/VTP_Casos_Mar/US_samples_fetusnet_full/prepared/1/nrrd/aligned/aligned_landmarks

output_dir: ${PROJECT_ROOT}/US_samples/VTP_Casos_Mar/US_samples_fetusnet_full/prepared/1/nrrd/aligned_to_template
transforms_dir: ${PROJECT_ROOT}/US_samples/VTP_Casos_Mar/US_samples_fetusnet_full/prepared/1/nrrd/aligned_to_template/transforms

# The transforms_dir written by 02_align_to_reference.yaml. This literal path
# makes standalone runs (run_stage.py) work on their own; when run through
# run_pipeline.py it could instead be set to "@previous".
previous_transforms_dir: ${PROJECT_ROOT}/US_samples/VTP_Casos_Mar/US_samples_fetusnet_full/prepared/1/nrrd/aligned/transforms

heatmap_prefix: heatmap_
with_scale: true
landmarks_frame: LPS  # frame the landmark CSVs are written in (RAS or LPS)
