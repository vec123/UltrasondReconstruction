# baby_ssm_fit_init_pca_times_gaussian and baby_ssm_fit_pca_times_gaussian (the same settings): only what differs from gpmm/fit/nicp/ssm_fit_common.yaml.
stage: ssm_fit
extends: gpmm/fit/nicp/ssm_fit_common.yaml

# The case for a run of this file alone (python scripts/run.py <this file>).
variables:
  DATASET: Casos_Mar
  SUBJECT_ID: 1
  WEEK: 20 semanas

# Only for a run of this file alone: a pipeline that names it gives its own paths.
paths:
  inputs: {shape_model_mat: '${PROJECT_ROOT}/assets/shape_models/baby/baby_pca_times_gaussian.npz', mesh_vtp: '${OUT}/${SESSION}/merged_high_confidence_scan/merged_high_confidence_scan_threshold_0.8.vtp',
    landmarks_json: '${OUT}/${SESSION}/aligned_to_template/landmarks_csv', template_vtp: '${PROJECT_ROOT}/assets/templates/baby_mean.vtp'}
  outputs: {dir: '${OUT}/baby_ssm/${SESSION}/end_to_end/init_pca_times_gaussian'}

# What a pipeline takes over (on top of gpmm/fit/nicp/ssm_fit_common.yaml).
hyperparameters:
  nicp:
    fits:
    - name: map_1x
      correspondence:
        name: constrained
        kwargs: {max_dist: 10.0, normal_thresh_deg: 60.0, k: 50, use_target_normals: true, one_to_one: true}
      loss:
        name: matched_l2
        kwargs: {reduction: mean}
      prior:
        name: mahalanobis
        kwargs: {weight: 0.1967, normalize: true}
      projection: {name: none}
      solver:
        name: normal_equations
        kwargs: {iterations: 10, learning_rate: 1.0, damping: 0}
      refresh_every: 1
