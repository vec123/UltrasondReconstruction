# python scripts/run.py configs/gpmm/sample/baby_pca_sobol1000.yaml
#
# 1000 shapes of the baby GPMM from a scrambled Sobol sequence over all its
# modes (src/shared/sampling/stage.py): the cohort in BabySSMData_sobol1000,
# which scripts/SSM/sample_cohort.py --sampling sobol --n 1000 --seed 0 wrote.
# A cohort run reads members/ as its source: and template.vtp as its target:.
# The stage does not write into a folder whose members/ holds shapes already.
stage: sample

model:
  kind: gpmm
  path: ${PROJECT_ROOT}/assets/shape_models/baby/baby_pca.npz

codes:
  source: prior
  n: 1000
  sampling: sobol
  seed: 0

output_dir: ${DATA_ROOT}/BabySSMData_sobol1000
