# Direct, from-scratch training on fused_targets_full313/train (281 cases), time-varying
# field + GLOBAL code (as outputs/Casos_Mar/resnet_lddmm_cohort_autodecoder_fieldweighted_nopos,
# the known-good from-scratch recipe: no LayerNorm, kinetic_weight 5000, no code
# regularisation - not cohort_autodecoder_direct_full313_train281.yaml's stationary-field,
# LayerNorm recipe, which stayed under-detailed in 3000 steps from scratch).
#
# Counterpart of cohort_autodecoder_direct_grid_full313_train281.yaml (same field, grid code
# instead of this global one).
#
# Run with:
#    python scripts/run_stage.py --config configs/resnet_lddmm/cohort_autodecoder_direct_timevarying_full313_train281.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets_full313/train
target: /home/victor/Escritorio/Data/fused_targets_full313/template.vtp
output_dir: ${PROJECT_ROOT}/outputs/direct_flow/timevarying-mlp2x128-kin5000_code128_codereg0_edgeweight3sp-template2scan_full313_train281

field:
  kind: time_varying_fourier
  num_steps: 20
  mlp: [128, 128]
  activation: relu
  grad_checkpointing: true   # 281 members x 1000 subsample points don't fit in 16 GB without it
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}

code:
  kind: auto_decoder
  n_z: 128
  position_aware: false

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 5000.0
  code_reg_weight: 0.0
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 3000
  batch: 281                        # = cohort size (train/): every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
