# cohort_autodecoder_fetal_layernorm_fit_on_babyssm_sobol1000_timevarying_full313.yaml with
# the position-aware 8x8x8x2 grid code (as
# cohort_autodecoder_fetal_layernorm_fit_on_babyssm_sobol1000_grid8c2_full313.yaml), starting
# from cohort_autodecoder_babyssm_sobol1000_timevarying_grid8c2_mlp2x128_layernorm_kin200.yaml's
# pretrained flow (time-varying field + grid code). Same recipe otherwise.
#
# Run with:
#    python scripts/run_stage.py --config configs/resnet_lddmm/cohort_autodecoder_fetal_layernorm_fit_on_babyssm_sobol1000_timevarying_grid8c2_full313.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets_full313/train
target: /home/victor/Escritorio/Data/fused_targets_full313/template.vtp
frame_source: /home/victor/Escritorio/Data/BabySSMData_sobol1000/members
output_dir: ${PROJECT_ROOT}/outputs/stage2_flow/babyssm-sobol1000-timevarying-grid8c2-mlp2x128-layernorm-kin200_free-layernorm-shared_fieldchange200_anchor0.01_codereg0.01dist_edgeweight3sp-template2scan_full313_train281

field:
  kind: time_varying_fourier
  num_steps: 20
  mlp: [128, 128]
  activation: relu
  norm: layer
  grad_checkpointing: true
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}   # never lowers alpha: stays at the checkpoint's 3

code:
  kind: auto_decoder
  n_z: 1024
  position_aware: true
  grid: 8
  grid_channels: 2
  grid_direct: true
  grid_reg:
    kind: distance
    low: 0.0
    high: 1.0
    near: 0.5
    far: 1.0

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 200.0
  code_reg_weight: 0.01             # times the weighted sum(code^2); only the far nodes count (grid_reg)
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward
  terms:
    - kind: field_change_kinetic
      weight: 200.0
    - kind: parameter_anchor
      weight: 0.01
      kwargs: {pattern: norm}

train:
  mode: cohort
  steps: 3000
  batch: 281                        # = cohort size (train/): every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
  freeze_flow: true
  freeze_flow_except: [norm]

init:
  checkpoint: ${PROJECT_ROOT}/outputs/baby_ssm_cohort/resnet_lddmm_cohort_autodecoder_sobol1000_timevarying_grid8c2_mlp2x128_layernorm_kin200/checkpoints/final.pt
  parts: [flow]
  continue_step_count: false
  code_init: mean
