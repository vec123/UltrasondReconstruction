# Applies the field-weighted, stationary-field cohort auto-decoder run
# (cohort_autodecoder_casos_mar_fieldweighted_direct_g8c2_dist_kin8000_cherry_svf.yaml): deforms its template, at full
# resolution, once per cohort member with that member's learned code, into
# <output_dir>/<member>/{world,normalized}/deformed.vtp.
#
# Run with:
#    python scripts/run_stage.py --config configs/resnet_lddmm/cohort_autodecoder_casos_mar_fieldweighted_direct_g8c2_dist_kin8000_cherry_svf_apply.yaml

stage: resnet_lddmm_apply

train_config: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g8c2_dist_kin8000_cherry_svf/config.json
checkpoint: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g8c2_dist_kin8000_cherry_svf/checkpoints
device: cuda
shapes: null   # every member
export:
  deformed: true
  trajectory: false
  references: true
  spaces: [world]
