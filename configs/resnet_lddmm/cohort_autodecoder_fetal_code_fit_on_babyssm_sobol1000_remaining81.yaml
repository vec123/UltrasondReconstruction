# cohort_autodecoder_fetal_code_fit_on_babyssm_sobol1000_timevarying_remaining81.yaml with the
# STATIONARY field + global code flow: the 81 train/ targets NOT in train_top200, their codes
# fitted against cohort_autodecoder_fetal_layernorm_fit_on_babyssm_sobol1000_top200.yaml's flow,
# fully frozen (its LayerNorm included - no freeze_flow_except). code_reg_weight 0.62 =
# 0.05 x 1000 / 81.
#
# Run with:
#    python scripts/run_stage.py --config configs/resnet_lddmm/cohort_autodecoder_fetal_code_fit_on_babyssm_sobol1000_remaining81.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets_full313/train_remaining81
target: /home/victor/Escritorio/Data/fused_targets_full313/template.vtp
frame_source: /home/victor/Escritorio/Data/BabySSMData_sobol1000/members
output_dir: ${PROJECT_ROOT}/outputs/stage2_flow/babyssm-sobol1000-mlp6x256-layernorm-kin200_codefrozen_code128_codereg0.62_edgeweight3sp-template2scan_remaining81

field:
  kind: stationary_fourier
  num_steps: 20
  mlp: [256, 256, 256, 256, 256, 256]
  activation: relu
  norm: layer
  grad_checkpointing: true
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}   # never lowers alpha: stays at the checkpoint's 3

code:
  kind: auto_decoder
  n_z: 128
  position_aware: false

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 200.0
  code_reg_weight: 0.62             # 0.05 x 1000 / 81, see the header
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 3000
  batch: 81                         # = cohort size (train_remaining81): every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
  freeze_flow: true                 # no freeze_flow_except: the whole flow, LayerNorm included, stays fixed

init:
  checkpoint: ${PROJECT_ROOT}/outputs/stage2_flow/babyssm-sobol1000-mlp6x256-layernorm-kin200_free-layernorm-shared_fieldchange200_anchor0.01_code128_codereg0.25_edgeweight3sp-template2scan_top200/checkpoints/final.pt
  parts: [flow]
  continue_step_count: false
  code_init: mean
