# cohort_autodecoder_fetal_residual_on_babyssm_sobol1000.yaml with a residual SPLIT into a
# symmetric and an asymmetric part (field.symmetry mode split, fields/symmetry.py): the residual
# is unchanged, but its symmetric part (g(x) + M g(Mx)) / 2 is charged at 0.3 x kinetic_weight
# and the asymmetric rest at the full kinetic_weight. Symmetric fetal differences are cheap,
# asymmetric ones possible but dearer. Prices: prior 20, symmetric residual 60, asymmetric 200.
#
# Training set: /home/victor/Escritorio/Data/fused_targets/train_106, links to the 110 fused
# targets minus 32_20 (a 12 mm cloud of scattered points, not a face) and the hold-outs
# 11_36, 13_26 and 16_26 (links in fused_targets/holdout_3, for code fits to the frozen flow).
#
# Run with:
#    python scripts/run_stage.py --config configs/resnet_lddmm/cohort_autodecoder_fetal_residual_split_on_babyssm_sobol1000.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets/train_106    # 110 minus 32_20 (no face) and the hold-outs
target: /home/victor/Escritorio/Data/fused_targets/template.vtp
frame_source: /home/victor/Escritorio/Data/BabySSMData_sobol1000/members
output_dir: ${PROJECT_ROOT}/outputs/stage2_flow/prior-babyssm-sobol1000-mlp6x256-kin200_discount0.1_residual-mlp2x128-fourier2-split-sym0.3_code128+32_kin200_codereg0.47_edgeweight3sp-template2scan_train106

field:
  kind: stationary_fourier          # the residual v_res
  num_steps: 20                     # = the prior's
  mlp: [128, 128]
  activation: relu
  fourier_n_e: 2
  fourier_anneal: {start: 500, end: 1500}
  grad_checkpointing: true
  prior:
    run: ${PROJECT_ROOT}/outputs/baby_ssm_cohort/resnet_lddmm_cohort_autodecoder_sobol1000_global_l2_mlp6x256_kin200
    discount: 0.1
  symmetry:                         # the residual only; the frozen prior keeps its own
    mode: split
    discount: 0.3                   # symmetric part at 0.3 x 200 = 60, asymmetric rest at 200
    pairs: [[enR, enL], [exR, exL], [aR, aL], [acR, acL]]
    midline: [n, prn, sn, ls, pg]

code:
  kind: auto_decoder
  n_z: 160                          # [z: 128 for v_baby | w: 32 for v_res]
  position_aware: false

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight   # x edge_weight of the nearest scan point: rim matches stop pulling
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support           # fusion support only: every scan point has a counterpart on the template
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 200.0
  code_reg_weight: 0.47
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 3000
  batch: 106                        # = cohort size: every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
