# cohort_autodecoder_fetal_layernorm_fit_on_babyssm_sobol1000_full110.yaml on the rebuilt
# 312-target snapshot (fused_targets_full313, see scripts/SSM/resample_fixed_points.py and the
# 2026-10-31 session): all 3 datasets (Casos_Mar, Casos_Maternitat, Estudio_Dexeus), not only
# Casos_Mar's first 110. train/ is a random 281 of the 312 (seed 42, 10% held out to test/,
# both symlink dirs into fused_targets_full313/targets).
#
# Same recipe as full110: the LayerNorm BabySSM flow frozen except its LayerNorm affines
# (shared over the cohort), one code per target. code_reg_weight 0.178 = 0.05 x 1000 / 281
# (the training's prior per member, scaled for this cohort size).
#
# Run with:
#    python scripts/run_stage.py --config configs/resnet_lddmm/cohort_autodecoder_fetal_layernorm_fit_on_babyssm_sobol1000_full313.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets_full313/train
target: /home/victor/Escritorio/Data/fused_targets_full313/template.vtp
frame_source: /home/victor/Escritorio/Data/BabySSMData_sobol1000/members
output_dir: ${PROJECT_ROOT}/outputs/stage2_flow/babyssm-sobol1000-mlp6x256-layernorm-kin200_free-layernorm-shared_fieldchange200_anchor0.01_code128_codereg0.178_edgeweight3sp-template2scan_full313_train281

field:
  kind: stationary_fourier
  num_steps: 20
  mlp: [256, 256, 256, 256, 256, 256]
  activation: relu
  norm: layer
  grad_checkpointing: true
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}

code:
  kind: auto_decoder
  n_z: 128
  position_aware: false

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 200.0
  code_reg_weight: 0.178            # 0.05 x 1000 / 281, see the header
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward
  terms:
    - kind: field_change_kinetic
      weight: 200.0
    - kind: parameter_anchor
      weight: 0.01
      kwargs: {pattern: norm}

train:
  mode: cohort
  steps: 3000
  batch: 281                        # = cohort size (train/): every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
  freeze_flow: true
  freeze_flow_except: [norm]

init:
  checkpoint: ${PROJECT_ROOT}/outputs/baby_ssm_cohort/resnet_lddmm_cohort_autodecoder_sobol1000_global_l2_mlp6x256_layernorm_kin200/checkpoints/final.pt
  parts: [flow]
  continue_step_count: false
  code_init: mean
