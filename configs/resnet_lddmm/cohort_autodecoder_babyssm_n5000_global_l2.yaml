# Cohort ResNet-LDDMM on a SYNTHETIC cohort: 5000 shapes drawn from the BabySSM prior
# (src/SSM/saved_models/baby/baby_pca.npz, all 163 modes), one flow from the model mean
# to every member, conditioned on a learned GLOBAL code per member (auto-decoder,
# position_aware: false - one vector for the whole face).
#
# The members are in vertex correspondence with the template, so the data term is the
# plain corresponded L2 (data_name: l2): the mapping error draws one subsample for the
# template and the member, and row i is compared to row i. No kinetic weight field,
# no landmark / fshape terms.
#
# batch < cohort size: every step uses a random 256 of the 5000 members, so each code
# is updated in about 1 of 20 steps; hence the higher step count.
#
# Inputs, written by:
#    python scripts/SSM/sample_cohort.py --model src/SSM/saved_models/baby/baby_pca.npz \
#        --output-dir /home/victor/Escritorio/Data/BabySSMData --n 5000 --seed 0
#
# Run with:
#    python scripts/run_stage.py --config configs/resnet_lddmm/cohort_autodecoder_babyssm_n5000_global_l2.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/BabySSMData/members
target: /home/victor/Escritorio/Data/BabySSMData/template.vtp
output_dir: ${PROJECT_ROOT}/outputs/baby_ssm_cohort/resnet_lddmm_cohort_autodecoder_n5000_global_l2

field:
  kind: stationary_fourier
  num_steps: 20
  mlp: [128, 128]
  activation: relu
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}

code:
  kind: auto_decoder
  n_z: 128
  position_aware: false

loss:
  data_name: l2
  sigma: 0.01              # data weight 1/(2 sigma^2), the scale of the chamfer runs' base_sigma
  kinetic_weight: 2000.0   # start value; L2 with correspondence constrains more than chamfer
  code_reg_weight: 0.01
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 20000
  batch: 256
  lr: 0.0001
  seed: 42
  log_every: 50
  save_every: 2000
  export_shapes: 4
  export_strategy: sequential
  device: cuda
