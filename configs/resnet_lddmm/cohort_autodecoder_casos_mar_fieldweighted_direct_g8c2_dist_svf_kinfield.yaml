# cohort_autodecoder_casos_mar_fieldweighted_direct_g8c2_dist_svf.yaml plus the point-weighted kinetic term: the template's kinetic_weight
# field (nose tip / subnasale ~0.2, rest 1, normalised to mean 1) at weight 5000, on
# top of the plain kinetic_weight 5000, as cohort_autodecoder_casos_mar_fieldweighted_direct_g8c2_dist_kinfield.yaml does for the time-varying field.
#
# cohort_autodecoder_casos_mar_fieldweighted_direct_g8c2_dist.yaml with a STATIONARY Fourier field (field.kind: stationary_fourier): one
# block reused at every Euler step instead of one block per step. Same bands, schedule,
# widths, codes and losses, so the two runs differ in the time dependence of the field only.
#
# cohort_autodecoder_casos_mar_fieldweighted_direct_g4c8_dist.yaml with a direct 8x8x8 grid of 2 channels (n_z = 1024): cells of about
# 11 mm, so bridge, nose tip, subnasale, eyes, mouth and chin get their own nodes.
#
# cohort_autodecoder_casos_mar_fieldweighted_direct_g4c8.yaml with a code penalty by distance to the face: grid nodes within
# half a cell of the template stay unregularised (as in cohort_autodecoder_casos_mar_fieldweighted_direct_g4c8), nodes from one
# cell on (towards the box boundary) are pulled to the mean, linear in between.
#
# cohort_autodecoder_casos_mar_fieldweighted_g4.yaml with a DIRECT 4x4x4 grid: each member's code is its 4x4x4x8 grid
# (n_z = 512), reshaped into the nodes instead of decoded by a linear layer.
#
# cohort_autodecoder_casos_mar_fieldweighted.yaml with a 4x4x4 position-aware code
# grid (cells ~1/3 of the box) instead of 2x2x2.
#
# cohort_autodecoder_casos_mar.yaml with the pair runs' data term
# (field_weighted_point2plane_chamfer: template side weighted by its landmark_weight
# field, each target by its own scan-fusion support) over all 110 fused targets.
#
# Cohort ResNet-LDDMM over the Casos_Mar fused targets: one flow from a single
# baby-mean template to every fused target, conditioned on a learned per-target
# code (auto-decoder). Positions are Fourier-encoded by the field; the codes are
# position-aware (interpolated off a grid, so a code can deform regions differently).
#
# No landmark / fshape / kinetic-field
# terms, no modes or local field. Applied per member by
# cohort_autodecoder_casos_mar_apply.yaml (point it at this run's output_dir).
#
# Inputs, prepared from the batch outputs:
#   template: the per-case baby_mean_aligned.vtp closest to the vertex mean of all
#     of them (case 1 / 20 semanas). assets/templates/baby_mean.vtp itself is stored
#     normalised (all coordinates ~0), not in the fused targets' template frame.
#   source: every fused_scan.vtp resampled to 4096 points (CohortBatchLoader stacks
#     the targets, so they need equal counts); smaller ones keep all their points
#     plus repeats. Their point arrays (normal, support, ...) are kept, row for row.
#
# Run with:
#    python scripts/run_stage.py --config configs/resnet_lddmm/cohort_autodecoder_casos_mar_fieldweighted_direct_g8c2_dist_svf_kinfield.yaml

stage: resnet_lddmm_train

source: ${PROJECT_ROOT}/outputs/Casos_Mar/cohort/fused_targets_4096_fields
target: ${PROJECT_ROOT}/outputs/Casos_Mar/cohort/template_baby_mean_aligned.vtp
output_dir: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g8c2_dist_svf_kinfield

field:
  kind: stationary_fourier
  num_steps: 20
  mlp: [128, 128]
  activation: relu
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}

code:
  kind: auto_decoder
  n_z: 1024
  position_aware: true
  grid: 8
  grid_channels: 2
  grid_direct: true
  grid_reg:
    kind: distance
    low: 0.0               # nodes near the face: free, as without regularisation
    high: 1.0              # nodes towards the boundary
    near: 0.5              # cells from the template up to which a node gets low
    far: 1.0               # cells from the template from which a node gets high

loss:
  # As the pair runs (end_to_end_casos_mar.yaml, resnet_lddmm_train).
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 5000.0
  kinetic_field_weight: 5000.0
  kinetic_field_kwargs: {field_name: kinetic_weight, normalize: true}
  code_reg_weight: 0.01    # times the weighted sum(code^2); only the far nodes count
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 3000
  batch: 1000            # >= cohort size: every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
