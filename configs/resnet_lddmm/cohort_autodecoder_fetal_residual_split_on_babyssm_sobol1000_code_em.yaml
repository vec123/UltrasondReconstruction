# cohort_autodecoder_fetal_residual_split_on_babyssm_sobol1000.yaml, continued from its final.pt
# (step 3000) for 1000 more steps with an EM-learned prior on the code entries the frozen
# v_baby reads (loss.code_prior_em, callbacks/schedules/code_prior_em.py):
#
#  * z (code entries 0..127, read by the frozen v_baby): prior N(m, C), fitted by EM to the
#    codes' Laplace posteriors at the first step, every 250 steps, and at train end. The
#    frozen v_baby fixes the scale of z, so the prior cannot drift against the network.
#  * w (entries 128..159, read by the trained residual v_res): the isotropic prior it was
#    trained with, unchanged.
#  * M-step: weight 1 / (scans of the fetus) per member; nu = 10 members' weight of the
#    starting isotropic prior. Laplace: central differences, step 0.1 x the prior std.
#
# The Fourier bands of v_res opened over steps 500..1500 of the first run; the step count
# continues from 3000 (init.continue_step_count), so they stay open.
#
# Run with:
#    python scripts/run_stage.py --config configs/resnet_lddmm/cohort_autodecoder_fetal_residual_split_on_babyssm_sobol1000_code_em.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets/train_106    # 110 minus 32_20 (no face) and the hold-outs
target: /home/victor/Escritorio/Data/fused_targets/template.vtp
frame_source: /home/victor/Escritorio/Data/BabySSMData_sobol1000/members
output_dir: ${PROJECT_ROOT}/outputs/UpdatedSSM/stage2_flow_code_EM/prior-babyssm-sobol1000-mlp6x256-kin200_discount0.1_residual-mlp2x128-fourier2-split-sym0.3_code128+32_kin200_codereg0.47_edgeweight3sp-template2scan_train106_codeEM-z128-every250-nu10-fetusweight-eps0.1_steps1000

init:
  checkpoint: ${PROJECT_ROOT}/outputs/stage2_flow/prior-babyssm-sobol1000-mlp6x256-kin200_discount0.1_residual-mlp2x128-fourier2-split-sym0.3_code128+32_kin200_codereg0.47_edgeweight3sp-template2scan_train106/checkpoints/final.pt

field:
  kind: stationary_fourier          # the residual v_res
  num_steps: 20                     # = the prior's
  mlp: [128, 128]
  activation: relu
  fourier_n_e: 2
  fourier_anneal: {start: 500, end: 1500}
  grad_checkpointing: true
  prior:
    run: ${PROJECT_ROOT}/outputs/baby_ssm_cohort/resnet_lddmm_cohort_autodecoder_sobol1000_global_l2_mlp6x256_kin200
    discount: 0.1
  symmetry:                         # the residual only; the frozen prior keeps its own
    mode: split
    discount: 0.3                   # symmetric part at 0.3 x 200 = 60, asymmetric rest at 200
    pairs: [[enR, enL], [exR, exL], [aR, aL], [acR, acL]]
    midline: [n, prn, sn, ls, pg]

code:
  kind: auto_decoder
  n_z: 160                          # [z: 128 for v_baby | w: 32 for v_res]
  position_aware: false

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight   # x edge_weight of the nearest scan point: rim matches stop pulling
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support           # fusion support only: every scan point has a counterpart on the template
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 200.0
  code_reg_weight: 0.47
  code_prior_em: {every: 250, nu: 10.0, weighting: fetus, rel_eps: 0.1}
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 1000                       # more, after the 3000 of final.pt
  batch: 106                        # = cohort size: every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
