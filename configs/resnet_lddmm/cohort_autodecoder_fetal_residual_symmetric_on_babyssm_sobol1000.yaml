# cohort_autodecoder_fetal_residual_on_babyssm_sobol1000.yaml with a MIRROR-SYMMETRIC residual
# (field.symmetry mode symmetric, fields/symmetry.py): v_res(x) = (g(x) + M g(Mx)) / 2, so the
# fetal difference from the baby flow is exactly symmetric; asymmetry comes from the prior only.
# The mirror plane is placed from the template's landmarks (4 pairs + 5 midline points); the
# BabySSM mean is exactly symmetric, so it fits to 0.03 % of the template diagonal.
#
# Run with:
#    python scripts/run_stage.py --config configs/resnet_lddmm/cohort_autodecoder_fetal_residual_symmetric_on_babyssm_sobol1000.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets/targets
target: /home/victor/Escritorio/Data/fused_targets/template.vtp
frame_source: /home/victor/Escritorio/Data/BabySSMData_sobol1000/members
output_dir: ${PROJECT_ROOT}/outputs/fetal_residual/prior-babyssm-sobol1000-mlp6x256-kin200_discount0.1_residual-mlp2x128-fourier2-symmetric_code128+32_kin200_codereg0.45_edges3sp_all110

field:
  kind: stationary_fourier          # the residual v_res
  num_steps: 20                     # = the prior's
  mlp: [128, 128]
  activation: relu
  fourier_n_e: 2
  fourier_anneal: {start: 500, end: 1500}
  grad_checkpointing: true
  prior:
    run: ${PROJECT_ROOT}/outputs/baby_ssm_cohort/resnet_lddmm_cohort_autodecoder_sobol1000_global_l2_mlp6x256_kin200
    discount: 0.1
  symmetry:                         # the residual only; the frozen prior keeps its own
    mode: symmetric
    pairs: [[enR, enL], [exR, exL], [aR, aL], [acR, acL]]
    midline: [n, prn, sn, ls, pg]

code:
  kind: auto_decoder
  n_z: 160                          # [z: 128 for v_baby | w: 32 for v_res]
  position_aware: false

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: true    # x support_edge of the nearest scan point: rim matches stop pulling
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support_edge      # support x edge_weight (scripts/write_edge_fields.py)
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 200.0
  code_reg_weight: 0.45
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 3000
  batch: 110                        # = cohort size: every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
