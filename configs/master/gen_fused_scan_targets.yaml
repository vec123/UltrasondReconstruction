# Fused scan targets only: the fusion part of end_to_end_casos_mar.yaml (stages,
# paths and hyperparameters copied from it - keep them in sync), for any
# landmark-predictor dataset (UltrasoundLandmarkPredictor/results/inference/<dataset>/).
#
# One run is one session: one case at one gestational age, e.g.
# <CASES_ROOT>/14/20 semanas/*.nrrd with its LMKS/*.csv. Datasets without week
# folders (Casos_Maternitat/<case>/*.nrrd) run with an empty WEEK.
#
# Every output goes under
#   ${DATA_ROOT}/fused_scan_processing/${DATASET}/${SUBJECT_ID}/${WEEK}/
# and the fused target is fused_scan_ssm/fused_scan.vtp there. The Casos_Mar
# targets of the first batch were moved into the same layout (symlinks at their
# old places under outputs/Casos_Mar/fetus_ssm/), so they are not run again.
#
# Run with:
#    python scripts/run_pipeline.py --config configs/master/gen_fused_scan_targets.yaml \
#        --set CASES_ROOT=/home/victor/Projects/UltrasoundLandmarkPredictor/results/inference/Estudio_Dexeus \
#        --set DATASET=Estudio_Dexeus --set SUBJECT_ID=Dex-76 --set "WEEK=26 semanas" \
#        --set REFERENCE_SCAN=Dex-76-26s-01 --set LANDMARKS_FRAME=LPS
# The predictor writes 1mm isotropic volumes with origin 0 and identity
# direction, and its landmarks in voxel indices, so LANDMARKS_FRAME is LPS.

stages:
  - name: nrrd_to_vtp
    enabled: true
  - name: align_to_reference
    enabled: true
  - name: align_to_template
    enabled: true
  - name: roughness_filter
    enabled: true
  - name: landmark_bbox_cut
    enabled: true
  - name: scan_consistency
    enabled: true
  - name: ssm_fit                     # its NICP mesh is the fusion's reference
    id: fetus_ssm_fit_init_pca
    enabled: true
  - name: scan_fusion
    id: scan_fusion_ssm
    enabled: true
  - name: recon_target_distance
    id: recon_target_distance_scan_fusion_ssm
    enabled: true

paths:
  nrrd_to_vtp:
    input_dir: ${CASES_ROOT}/${SUBJECT_ID}/${WEEK}
    output_dir: ${DATA_ROOT}/fused_scan_processing/${DATASET}/${SUBJECT_ID}/${WEEK}
    cache_dir: ${DATA_ROOT}/fused_scan_processing/${DATASET}/${SUBJECT_ID}/${WEEK}/Cache
  align_to_reference:
    landmarks_csv_dir: ${CASES_ROOT}/${SUBJECT_ID}/${WEEK}/LMKS
    vtp_shapes_dir: nrrd_to_vtp.output_dir
    output_dir: nrrd_to_vtp.output_dir + /aligned
    raw_landmarks_vtp_dir: nrrd_to_vtp.output_dir + /raw_landmarks_vtp
    transforms_dir: nrrd_to_vtp.output_dir + /aligned/transforms
    previous_transforms_dir: null
    aligned_shapes_vtp_dir: nrrd_to_vtp.output_dir + /aligned/aligned_shapes_vtp
    aligned_landmarks_dir: nrrd_to_vtp.output_dir + /aligned/aligned_landmarks
  align_to_template:
    template_vtp: ${PROJECT_ROOT}/assets/templates/fetus_mean.vtp
    vtp_shapes_dir: align_to_reference.aligned_shapes_vtp_dir
    landmarks_csv_dir: align_to_reference.aligned_landmarks_dir
    output_dir: nrrd_to_vtp.output_dir + /aligned_to_template
    out_shapes_vtp_dir: nrrd_to_vtp.output_dir + /aligned_to_template/shapes_vtp
    out_landmarks_vtp_dir: nrrd_to_vtp.output_dir + /aligned_to_template/landmarks_vtp
    out_landmarks_csv_dir: nrrd_to_vtp.output_dir + /aligned_to_template/landmarks_csv
    transforms_dir: nrrd_to_vtp.output_dir + /aligned_to_template/transforms
    previous_transforms_dir: align_to_reference.transforms_dir
  roughness_filter:
    input_dir: align_to_template.out_shapes_vtp_dir
    output_dir: align_to_template.output_dir + /roughness_filtered
    unfiltered_dir: align_to_template.output_dir + /roughness_unfiltered
    transforms_dir: align_to_template.transforms_dir
  landmark_bbox_cut:
    shapes_dir: align_to_template.out_shapes_vtp_dir
    landmarks_dir: align_to_template.out_landmarks_vtp_dir
    output_dir: nrrd_to_vtp.output_dir + /aligned_to_template/landmark_bbox_cut
    transforms_dir: align_to_template.transforms_dir
  scan_consistency:
    input_aligned_dir: landmark_bbox_cut.output_dir
    output_consistency_dir: nrrd_to_vtp.output_dir + /consistency_shapes_vtp
    output_denoised_dir: nrrd_to_vtp.output_dir + /consistency_thresholds
    output_merged_dir: nrrd_to_vtp.output_dir + /merged_high_confidence_scan
    transforms_dir: align_to_template.transforms_dir
  fetus_ssm_fit_init_pca:
    inputs:
      shape_model_mat: ${PROJECT_ROOT}/assets/shape_models/fetus/fetus_pca.npz
      mesh_vtp: scan_consistency.output_merged_dir + /merged_high_confidence_scan_threshold_0.8.vtp
      landmarks_json: align_to_template.out_landmarks_csv_dir
      template_vtp: ${PROJECT_ROOT}/assets/templates/fetus_mean.vtp
    outputs:
      dir: nrrd_to_vtp.output_dir + /fetus_ssm/init_pca
  scan_fusion_ssm:
    input_aligned_dir: scan_consistency.output_denoised_dir + /threshold_0.6
    reference_vtp: fetus_ssm_fit_init_pca.outputs.dir + /nicp_refined_vertices_map_1x.vtp
    output_dir: nrrd_to_vtp.output_dir + /fused_scan_ssm
    transforms_dir: align_to_template.transforms_dir
  recon_target_distance_scan_fusion_ssm:
    target_path: scan_consistency.output_merged_dir + /merged_high_confidence_scan_threshold_0.8.vtp
    recon_path: scan_fusion_ssm.output_dir + /fused_scan.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: scan_fusion_ssm.output_dir + /eval

hyperparameters:
  nrrd_to_vtp:
    contour_value: 70
    auto_contour: false
    reduction_factor: 0.1
    min_bridge_width: 0
    min_bridge_relative: false
    compute_curvedness: false
    curvedness_n_rings: 5
    curvedness_scale_invariant: false
    operators: false
    k_eig: 200
    flat:
      enabled: false
      n_rings: 5
      thresh: 0.1
      max_area: 0.05
    volume:
      denoise: null
      denoise_radius: 5
      normalize: false
      clip_percentiles: [1.0, 99.0]
      norm_out_max: 255.0
      crop: false
      crop_threshold: 0
      crop_margin: 0
      four_d: skip  # 4D (x, y, z, t) volumes: skip (with a warning) | mean | median | <frame index>

  align_to_reference:
    reference_subject_id: ${REFERENCE_SCAN}  # scan every other scan is aligned onto
    with_scale: true
    landmarks_frame: ${LANDMARKS_FRAME}  # frame the landmark CSVs are written in

  align_to_template:
    heatmap_prefix: heatmap_
    with_scale: true
    landmarks_frame: LPS  # frame the landmark CSVs are written in (RAS or LPS)

  recon_target_distance:
    units: mm (original scan frame)
    # Share of points within each of these distances, per direction, in mm.
    coverage_thresholds: [1.0, 2.0, 3.0]
    landmark_metric: []

  roughness_filter:
    n_rings: 5
    scale_invariant: false
    method: quadric
    threshold: 0.9
    neighbors: knn
    max_neighbors: 32
    min_bridge_width: 0
    min_bridge_relative: false

  landmark_bbox_cut:
    x_min_offset_mm: 10.0
    x_max_offset_mm: 10.0
    y_min_offset_mm: 3.0
    y_max_offset_mm: 35.0
    z_min_offset_mm: 20.0
    z_max_offset_mm: 5.0
    keep_largest_component: false
    min_bridge_width: 0
    min_bridge_relative: false

  scan_consistency:
    sigma_mm: 2.0
    apply_denoise_threshold: true
    min_consistency_threshold: [0.99, 0.9, 0.7, 0.8, 0.6, 0.5, 0.3, 0.2]
    denoise_min_bridge_width: 0
    denoise_min_bridge_relative: true

  # The fetus PCA fit whose NICP mesh (map_1x) is the fusion's reference topology.
  # Weight calibrated in end_to_end_casos_mar.yaml:
  # L=183 modes, chi2_99=230.4, sigma_n^2=10.13, lambda_max=1.86, P=2058 pairs
  fetus_ssm_fit_init_pca:
    steps:
      gmm_2_template: false
      align: true
      landmark_fit: true
      nicp: true
      laplacian: false
    model:
      normalize: false
      atlas:
        # FetusModel_x4 only has 13 of the 19 baby landmarks annotated
        landmarks: ${PROJECT_ROOT}/assets/atlases/FetusModel_x4/landmarks.json
    rigid:
      iterations: 10
      landmark_fit_learning_rate: 1.0
      allow_scale: true
    nicp:
      save_every: 1
      device: cpu                   # no stage here needs the GPU; keeps it free for training
      defaults: {}
      fits:
        - name: map_1x
          correspondence:
            name: constrained
            kwargs: {max_dist: 10.0, normal_thresh_deg: 60.0, k: 50,
                     use_target_normals: true, one_to_one: true}
          loss:       {name: matched_l2, kwargs: {reduction: mean}}
          prior:      {name: mahalanobis, kwargs: {weight: 0.002646, normalize: true}}
          projection: {name: none}
          solver: {name: normal_equations,
                   kwargs: {iterations: 10, learning_rate: 1.0, damping: 0}}
          refresh_every: 1          # re-match every round: this is the ICP loop
    verbose: true

  scan_fusion_ssm:
    sigma_mm: 2  # spatial tolerance in mm; subject points within sigma_mm pull a reference vertex toward them
    min_support: 0.0001  # reference vertices with total kernel weight below this are dropped
    normal_power: 1
    surface_fit_n_rings: 5
    surface_fit_method: quadric  # "plane" | "quadric"
    compute_roughness: false
