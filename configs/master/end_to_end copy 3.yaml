# End-to-end example wiring all three pipelines from one file:
#
# Any stage can be switched off with `enabled: false` (its config still binds,
# so later stages can still reference its fields - see scripts/pipeline/cli.py).
#
# Run with:
#   python scripts/run_pipeline.py --config configs/master/end_to_end.yaml --set SUBJECT_ID=1 --set REFERENCE_SCAN=SdeFrankterHaar-01
#
# REFERENCE_SCAN is the scan (file name without extension) every other scan is
# aligned onto, e.g. SdeFrankterHaar-01 for SUBJECT_ID=9992.

stages:

#-----------Preprocessing
  - name: nrrd_to_vtp
    enabled: false
  - name: align_to_reference
    enabled: false
  - name: align_to_template
    enabled: false
  - name: roughness_filter
    enabled: false
  - name: landmark_bbox_cut
    enabled: false
  - name: scan_consistency
    enabled: false



#-----------ssm fits

#-----------fetus ssm (pre-fusion)
  - name: ssm_fit
    id: fetus_ssm_fit_init_pca
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_fetus_init_mean_shape
    enabled: false

  - name: ssm_fit
    id: fetus_ssm_fit_init_pca_times_gaussian
    enabled: false

  - name: ssm_fit
    id: fetus_ssm_fit_init_pca_times_wendland
    enabled: false

  - name: ssm_fit
    id: fetus_ssm_fit_init_pca_sum_matern32
    enabled: true

  - name: recon_target_distance
    id: recon_target_distance_fetus_init_pca_map
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_fetus_init_pca_p2plane
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_fetus_init_pca_times_gaussian_map
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_fetus_init_pca_times_gaussian_p2plane
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_fetus_init_pca_times_wendland_map
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_fetus_init_pca_times_wendland_p2plane
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_fetus_init_pca_sum_matern32_map
    enabled: true

#-----------baby ssm (pre-fusion)
  - name: ssm_fit
    id: baby_ssm_fit_init_pca
    enabled: false
  # One mean-shape eval for the whole baby pre-fusion sweep.
  - name: recon_target_distance
    id: recon_target_distance_baby_init_mean_shape
    enabled: true

  - name: ssm_fit
    id: baby_ssm_fit_init_pca_times_gaussian
    enabled: false

  - name: ssm_fit
    id: baby_ssm_fit_init_pca_times_wendland
    enabled: false

  - name: ssm_fit
    id: baby_ssm_fit_init_pca_sum_matern32
    enabled: true

  - name: recon_target_distance
    id: recon_target_distance_baby_init_pca_map
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_init_pca_p2plane
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_init_pca_times_gaussian_map
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_init_pca_times_gaussian_p2plane
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_init_pca_times_wendland_map
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_init_pca_times_wendland_p2plane
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_init_pca_sum_matern32_map
    enabled: true

#-----------scan fusion
  - name: scan_fusion
    id: scan_fusion_ssm
    enabled: true

  - name: recon_target_distance
    id: recon_target_distance_scan_fusion_ssm
    enabled: true

#-----------baby ssm (post-fusion)
  - name: ssm_fit
    id: baby_ssm_fit_pca
    enabled: true

  - name: recon_target_distance
    id: recon_target_distance_baby_fused_mean_shape
    enabled: true

  - name: ssm_fit
    id: baby_ssm_fit_pca_times_gaussian
    enabled: false

  - name: ssm_fit
    id: baby_ssm_fit_pca_times_wendland
    enabled: false

  - name: ssm_fit
    id: baby_ssm_fit_pca_sum_matern32
    enabled: true

  - name: recon_target_distance
    id: recon_target_distance_baby_pca_map
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_pca_p2plane
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_pca_times_gaussian_map
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_pca_times_gaussian_p2plane
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_pca_times_wendland_map
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_pca_times_wendland_p2plane
    enabled: false

  - name: recon_target_distance
    id: recon_target_distance_baby_pca_sum_matern32_map
    enabled: true



#----------------------------LDDMM

#-----------lddmm baby ssm
  - name: similarity_transform
    id: similarity_transform_baby_ssm
    enabled: false
  - name: resnet_lddmm_train
    id: resnet_lddmm_train_baby_ssm
    enabled: false
  - name: resnet_lddmm_apply
    id: resnet_lddmm_apply_baby_ssm
    enabled: false
  - name: recon_target_distance
    id: recon_target_distance_baby_ssm_lddmm
    enabled: false
  - name: recon_target_distance
    id: recon_target_distance_baby_ssm_lddmm_high_confidence
    enabled: false



#-----------lddmm baby mean
  - name: similarity_transform
    id: similarity_transform_baby_mean
    enabled: true
  - name: resnet_lddmm_train
    id: resnet_lddmm_train_baby_mean
    enabled: true
  - name: resnet_lddmm_apply
    id: resnet_lddmm_apply_baby_mean
    enabled: true
  - name: recon_target_distance
    id: recon_target_distance_baby_mean_lddmm
    enabled: true
  - name: recon_target_distance
    id: recon_target_distance_baby_mean_lddmm_high_confidence
    enabled: true

#-----------lddmm fetus ssm
  - name: similarity_transform
    id: similarity_transform_fetus_ssm
    enabled: false
  - name: resnet_lddmm_train
    id: resnet_lddmm_train_fetus_ssm
    enabled: false
  - name: resnet_lddmm_apply
    id: resnet_lddmm_apply_fetus_ssm
    enabled: false
  - name: recon_target_distance
    id: recon_target_distance_fetus_ssm_lddmm
    enabled: false
  - name: recon_target_distance
    id: recon_target_distance_fetus_ssm_lddmm_high_confidence
    enabled: false

#-----------lddmm fetus mean
  - name: similarity_transform
    id: similarity_transform_fetus_mean
    enabled: false 
  - name: resnet_lddmm_train
    id: resnet_lddmm_train_fetus_mean
    enabled: false
  - name: resnet_lddmm_apply
    id: resnet_lddmm_apply_fetus_mean
    enabled: false
  - name: recon_target_distance
    id: recon_target_distance_fetus_mean_lddmm
    enabled: false
  - name: recon_target_distance
    id: recon_target_distance_fetus_mean_lddmm_high_confidence
    enabled: false



#------------fit summaries: each fit's distance distribution on one pair of axes.
  - name: distance_distribution_overlay
    id: fit_summary_prefusion_ssm
    enabled: true

  - name: distance_distribution_overlay
    id: fit_summary_high_confidence_target
    enabled: true

  - name: distance_distribution_overlay
    id: fit_summary_fused_target
    enabled: true


#------------eval lines in ultrasound
  - name: vtp_to_nrrd_overlay
    enabled: false


paths:

  #---------Preprocessing Step 1
  nrrd_to_vtp:
    input_dir: ${PROJECT_ROOT}/Ultrasounds/${SUBJECT_ID}/20_semanas
    output_dir: ${PROJECT_ROOT}/outputs/${SUBJECT_ID}/20_semanas
    cache_dir: ${PROJECT_ROOT}/outputs/${SUBJECT_ID}/20_semanas/Cache

  align_to_reference:
    landmarks_csv_dir: ${PROJECT_ROOT}/Ultrasounds/${SUBJECT_ID}/20_semanas/Lmks
    vtp_shapes_dir: nrrd_to_vtp.output_dir
    output_dir: nrrd_to_vtp.output_dir + /aligned
    raw_landmarks_vtp_dir: nrrd_to_vtp.output_dir + /raw_landmarks_vtp
    transforms_dir: nrrd_to_vtp.output_dir + /aligned/transforms
    previous_transforms_dir: null
    aligned_shapes_vtp_dir: nrrd_to_vtp.output_dir + /aligned/aligned_shapes_vtp
    aligned_landmarks_dir: nrrd_to_vtp.output_dir + /aligned/aligned_landmarks

  align_to_template:
    template_vtp: ${PROJECT_ROOT}/Templates/fetus_mean.vtp
    vtp_shapes_dir: align_to_reference.aligned_shapes_vtp_dir
    landmarks_csv_dir: align_to_reference.aligned_landmarks_dir
    output_dir: nrrd_to_vtp.output_dir + /aligned_to_template
    out_shapes_vtp_dir: nrrd_to_vtp.output_dir + /aligned_to_template/shapes_vtp
    out_landmarks_vtp_dir: nrrd_to_vtp.output_dir + /aligned_to_template/landmarks_vtp
    out_landmarks_csv_dir: nrrd_to_vtp.output_dir + /aligned_to_template/landmarks_csv
    transforms_dir: nrrd_to_vtp.output_dir + /aligned_to_template/transforms
    previous_transforms_dir: align_to_reference.transforms_dir

  roughness_filter:
    input_dir: align_to_template.out_shapes_vtp_dir
    output_dir: align_to_template.output_dir + /roughness_filtered
    unfiltered_dir: align_to_template.output_dir + /roughness_unfiltered
    transforms_dir: align_to_template.transforms_dir

  landmark_bbox_cut:
    shapes_dir: align_to_template.out_shapes_vtp_dir
    landmarks_dir: align_to_template.out_landmarks_vtp_dir
    output_dir: nrrd_to_vtp.output_dir + /aligned_to_template/landmark_bbox_cut
    transforms_dir: align_to_template.transforms_dir

  scan_consistency:
    input_aligned_dir: landmark_bbox_cut.output_dir
    output_consistency_dir: nrrd_to_vtp.output_dir + /consistency_shapes_vtp
    output_denoised_dir: nrrd_to_vtp.output_dir + /consistency_thresholds
    output_merged_dir: nrrd_to_vtp.output_dir + /merged_high_confidence_scan
    transforms_dir: align_to_template.transforms_dir

  #---------Preprocessing Step 1 END

  #---------Processing Step 2

  #---------SSM fits, round 1 (pre-fusion): fit each shape model as seg mask
  fetus_ssm_fit_init_pca:
    inputs: &fetus_init_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/fetus/fetus_pca.npz
      mesh_vtp: scan_consistency.output_merged_dir + /merged_high_confidence_scan_threshold_0.8.vtp
      landmarks_json: align_to_template.out_landmarks_csv_dir
      template_vtp: ${PROJECT_ROOT}/Templates/fetus_mean.vtp
    outputs:
      dir: ${PROJECT_ROOT}/outputs/fetus_ssm/${SUBJECT_ID}/end_to_end/init_pca

  fetus_ssm_fit_init_pca_times_gaussian:
    inputs:
      <<: *fetus_init_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/fetus/fetus_pca_times_gaussian.npz
    outputs:
      dir: ${PROJECT_ROOT}/outputs/fetus_ssm/${SUBJECT_ID}/end_to_end/init_pca_times_gaussian

  fetus_ssm_fit_init_pca_times_wendland:
    inputs:
      <<: *fetus_init_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/fetus/fetus_pca_times_wendland.npz
    outputs:
      dir: ${PROJECT_ROOT}/outputs/fetus_ssm/${SUBJECT_ID}/end_to_end/init_pca_times_wendland

  fetus_ssm_fit_init_pca_sum_matern32:
    inputs:
      <<: *fetus_init_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/fetus/fetus_pca_sum_matern32.npz
    outputs:
      dir: ${PROJECT_ROOT}/outputs/fetus_ssm/${SUBJECT_ID}/end_to_end/init_pca_sum_matern32

  baby_ssm_fit_init_pca:
    inputs: &baby_init_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/baby/baby_pca.npz
      mesh_vtp: scan_consistency.output_merged_dir + /merged_high_confidence_scan_threshold_0.8.vtp
      landmarks_json: align_to_template.out_landmarks_csv_dir
      template_vtp: ${PROJECT_ROOT}/Templates/baby_mean.vtp
    outputs:
      dir: ${PROJECT_ROOT}/outputs/baby_ssm/${SUBJECT_ID}/end_to_end/init_pca

  baby_ssm_fit_init_pca_times_gaussian:
    inputs:
      <<: *baby_init_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/baby/baby_pca_times_gaussian.npz
    outputs:
      dir: ${PROJECT_ROOT}/outputs/baby_ssm/${SUBJECT_ID}/end_to_end/init_pca_times_gaussian

  baby_ssm_fit_init_pca_times_wendland:
    inputs:
      <<: *baby_init_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/baby/baby_pca_times_wendland.npz
    outputs:
      dir: ${PROJECT_ROOT}/outputs/baby_ssm/${SUBJECT_ID}/end_to_end/init_pca_times_wendland

  baby_ssm_fit_init_pca_sum_matern32:
    inputs:
      <<: *baby_init_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/baby/baby_pca_sum_matern32.npz
    outputs:
      dir: ${PROJECT_ROOT}/outputs/baby_ssm/${SUBJECT_ID}/end_to_end/init_pca_sum_matern32


  
  #------------------Fusion-target-folder
  fusion_target: &fusion_target scan_consistency.output_denoised_dir + /threshold_0.6
  #input_aligned_dir: align_to_template.out_shapes_vtp_dir
  #------------------Scan Fusion
  scan_fusion_ssm:
    input_aligned_dir: *fusion_target  
    reference_vtp: fetus_ssm_fit_init_pca.outputs.dir + /nicp_refined_vertices_map_1x.vtp
    output_dir: ${PROJECT_ROOT}/outputs/fetus_ssm/${SUBJECT_ID}/end_to_end/fused_scan_ssm
    transforms_dir: align_to_template.transforms_dir

  recon_target_distance_scan_fusion_ssm:
    target_path: scan_consistency.output_merged_dir + /merged_high_confidence_scan_threshold_0.8.vtp
    recon_path: scan_fusion_ssm.output_dir + /fused_scan.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: scan_fusion_ssm.output_dir + /eval

  #---------SSM fits, round 2 (post-fusion): the three baby models against the
  baby_ssm_fit_pca:
    inputs: &baby_fused_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/baby/baby_pca.npz
      mesh_vtp: scan_fusion_ssm.output_dir + /fused_scan.vtp
      landmarks_json: align_to_template.out_landmarks_csv_dir
      template_vtp: ${PROJECT_ROOT}/Templates/baby_mean.vtp
    outputs:
      dir: ${PROJECT_ROOT}/outputs/baby_ssm/${SUBJECT_ID}/end_to_end/pca

  baby_ssm_fit_pca_times_gaussian:
    inputs:
      <<: *baby_fused_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/baby/baby_pca_times_gaussian.npz
    outputs:
      dir: ${PROJECT_ROOT}/outputs/baby_ssm/${SUBJECT_ID}/end_to_end/pca_times_gaussian

  baby_ssm_fit_pca_times_wendland:
    inputs:
      <<: *baby_fused_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/baby/baby_pca_times_wendland.npz
    outputs:
      dir: ${PROJECT_ROOT}/outputs/baby_ssm/${SUBJECT_ID}/end_to_end/pca_times_wendland

  baby_ssm_fit_pca_sum_matern32:
    inputs:
      <<: *baby_fused_inputs
      shape_model_mat: ${PROJECT_ROOT}/src/SSM/saved_models/baby/baby_pca_sum_matern32.npz
    outputs:
      dir: ${PROJECT_ROOT}/outputs/baby_ssm/${SUBJECT_ID}/end_to_end/pca_sum_matern32




  #---------Reconstruction-to-target distance, one per scored SSM fit.
  # Each fit stage writes one nicp_refined_vertices_<name>.vtp per entry in its
  # fits list; these score the mean shape it started from (init_shape.vtp), the
  # damped-L2 representative of the sweep (map_1x) and the correspondence-free
  # chamfer fit, into eval_mean/ eval_map/ eval_p2plane/ beside that fit.
  #
  # target_path is ALWAYS that fit's own rigid_alignment.vtp, never the scan
  # file the fit read. steps.align maps the target scan into MODEL space and
  # every reconstruction comes out there (see src/SSM/runners/pipeline.py) -
  # the baby models' frame is ~0.02 units across against the fetus template's
  # ~100, so pairing a recon with the scan in its own frame measures the frame
  # gap, not the fit. rigid_alignment.vtp is that same scan already carried
  # into the fit's model space by step 1, so the pair is consistent by
  # construction. The stage then fits one landmark similarity off the recon and
  # applies it to BOTH meshes, which is what puts the reported distances in the
  # subject's landmark frame and makes them comparable across models.
  #
  # That frame is align_to_reference's aligned_landmarks, NOT
  # align_to_template's landmarks_csv: align_to_reference is fit onto the
  # reference scan, which is REFERENCE_SCAN itself (reference_subject_id), so
  # its transform for that scan is the identity and the CSV is the original
  # Slicer landmarks, only converted to LPS (see landmarks_frame). The
  # distances therefore come out in original scan mm. align_to_template's CSVs
  # would work equally well as a common frame, but carry that stage's extra
  # size normalisation onto the template (s = 1.236 for this subject), so the
  # numbers would be template units ~1.24x larger than mm.
  #
  # Alongside the surface distances, each run also writes
  # landmark_distances.json: the per-label Mahalanobis distance
  # sqrt(d^T M d) between the recon's own heatmap landmarks (carried into the
  # landmark frame by that same similarity) and the CSV landmarks of
  # landmarks_path. M defaults to the identity - plain Euclidean - and can be
  # overridden per stage with a 3x3 `landmark_metric:` (e.g. the inverse of a
  # landmark covariance, to weight the axes).

  #-- Mean shape, once per (domain, round)
  # The mean shape is a property of the DOMAIN, not of the kernel: every model
  # in a sweep is built on the same training set, so their `mean` arrays are
  # bit-identical and init_shape.vtp is the same surface in each fit folder.
  # Scoring it once per (domain, round) therefore replaces one eval_mean per
  # model, all of which returned identical numbers. It hangs off the PCA fit -
  # the baseline of the sweep - because init_shape.vtp has to come from some
  # fit's folder, but it characterises the whole group, so it is written
  # beside the per-model folders rather than inside one (as scan_fusion is).
  recon_target_distance_fetus_init_mean_shape:
    target_path: fetus_ssm_fit_init_pca.outputs.dir + /rigid_alignment.vtp
    recon_path: fetus_ssm_fit_init_pca.outputs.dir + /init_shape.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: ${PROJECT_ROOT}/outputs/fetus_ssm/${SUBJECT_ID}/end_to_end/eval_init_mean_shape

  recon_target_distance_baby_init_mean_shape:
    target_path: baby_ssm_fit_init_pca.outputs.dir + /rigid_alignment.vtp
    recon_path: baby_ssm_fit_init_pca.outputs.dir + /init_shape.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: ${PROJECT_ROOT}/outputs/baby_ssm/${SUBJECT_ID}/end_to_end/eval_init_mean_shape

  recon_target_distance_baby_fused_mean_shape:
    target_path: baby_ssm_fit_pca.outputs.dir + /rigid_alignment.vtp
    recon_path: baby_ssm_fit_pca.outputs.dir + /init_shape.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: ${PROJECT_ROOT}/outputs/baby_ssm/${SUBJECT_ID}/end_to_end/eval_fused_mean_shape

  #-- Fetus PCA (pre-fusion)

  recon_target_distance_fetus_init_pca_map:
    target_path: fetus_ssm_fit_init_pca.outputs.dir + /rigid_alignment.vtp
    recon_path: fetus_ssm_fit_init_pca.outputs.dir + /nicp_refined_vertices_map_1x.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: fetus_ssm_fit_init_pca.outputs.dir + /eval_map

  recon_target_distance_fetus_init_pca_p2plane:
    target_path: fetus_ssm_fit_init_pca.outputs.dir + /rigid_alignment.vtp
    recon_path: fetus_ssm_fit_init_pca.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: fetus_ssm_fit_init_pca.outputs.dir + /eval_p2plane

  #-- Fetus PCA x Gaussian (pre-fusion)

  recon_target_distance_fetus_init_pca_times_gaussian_map:
    target_path: fetus_ssm_fit_init_pca_times_gaussian.outputs.dir + /rigid_alignment.vtp
    recon_path: fetus_ssm_fit_init_pca_times_gaussian.outputs.dir + /nicp_refined_vertices_map_1x.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: fetus_ssm_fit_init_pca_times_gaussian.outputs.dir + /eval_map

  recon_target_distance_fetus_init_pca_times_gaussian_p2plane:
    target_path: fetus_ssm_fit_init_pca_times_gaussian.outputs.dir + /rigid_alignment.vtp
    recon_path: fetus_ssm_fit_init_pca_times_gaussian.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: fetus_ssm_fit_init_pca_times_gaussian.outputs.dir + /eval_p2plane

  #-- Fetus PCA x Wendland (pre-fusion)

  recon_target_distance_fetus_init_pca_times_wendland_map:
    target_path: fetus_ssm_fit_init_pca_times_wendland.outputs.dir + /rigid_alignment.vtp
    recon_path: fetus_ssm_fit_init_pca_times_wendland.outputs.dir + /nicp_refined_vertices_map_1x.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: fetus_ssm_fit_init_pca_times_wendland.outputs.dir + /eval_map

  recon_target_distance_fetus_init_pca_times_wendland_p2plane:
    target_path: fetus_ssm_fit_init_pca_times_wendland.outputs.dir + /rigid_alignment.vtp
    recon_path: fetus_ssm_fit_init_pca_times_wendland.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
    output_dir: fetus_ssm_fit_init_pca_times_wendland.outputs.dir + /eval_p2plane

  #-- Fetus PCA + Matern-3/2 (pre-fusion)

  recon_target_distance_fetus_init_pca_sum_matern32_map:
    target_path: fetus_ssm_fit_init_pca_sum_matern32.outputs.dir + /rigid_alignment.vtp
