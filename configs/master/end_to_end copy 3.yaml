  # lddmm_train_config: the run's own dumped config, so lddmm_landmarks.vtp
  # holds exactly the averaged target landmarks that run guided on, carried
  # into the eval frame beside recon_landmarks.vtp / reference_landmarks.vtp.
  recon_target_distance_baby_ssm_lddmm:
    target_path: scan_fusion_ssm.output_dir + /fused_scan.vtp
    recon_path: resnet_lddmm_apply_baby_ssm.output_dir + /world/deformed.vtp
    landmarks_path: align_to_reference.aligned_landmarks_dir + /${REFERENCE_SCAN}_landmarks.csv
