        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_pca_times_wendland.outputs.dir + /nicp_refined_vertices_map_1x.vtp
        name: SSM Fit (Baby fused, PCA x Wendland, MAP)
