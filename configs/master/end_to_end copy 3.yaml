    lddmm_train_config: resnet_lddmm_train_baby_ssm.output_dir + /config.json

  # Second eval for the same reconstruction, against the merged high-confidence
  # scan instead of the fused one - the target the PRE-fusion SSM fits are
  # scored on, so LDDMM and those fits are finally measured on common ground.
  # Same frame either way: scan_fusion, its own eval and this one all live in
  # the template frame, and recon_target_distance carries whatever it is handed
  # into the landmark frame regardless (recon_target_distance_scan_fusion_ssm
  # already pairs the merged scan with fused_scan directly). Note the merged scan is the dense
  # ~186k-point cloud, where fused_scan is the ~6k-point fused surface, so the
