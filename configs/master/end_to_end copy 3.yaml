#---------Hyperparameters:
hyperparameters:
  nrrd_to_vtp:
    contour_value: 70
    auto_contour: false
    reduction_factor: 0.1
    min_bridge_width: 0
    min_bridge_relative: false
    compute_curvedness: false
    curvedness_n_rings: 5
    curvedness_scale_invariant: false
    operators: false
    k_eig: 200
    flat:
      enabled: false
      n_rings: 5
      thresh: 0.1
      max_area: 0.05
    volume:
      denoise: null
      denoise_radius: 5
      normalize: false
      clip_percentiles: [1.0, 99.0]
      norm_out_max: 255.0
      crop: false
      crop_threshold: 0
      crop_margin: 0

  align_to_reference:
    reference_subject_id: ${REFERENCE_SCAN}  # scan every other scan is aligned onto; the REFERENCE_SCAN paths read its outputs
    with_scale: true
    landmarks_frame: LPS  # frame the landmark CSVs are written in: Lmks_Antonia (subjects 1, 2, 14) is RAS, 9992's Lmks is LPS

  align_to_template:
    heatmap_prefix: heatmap_
    with_scale: true
    landmarks_frame: LPS  # frame the landmark CSVs are written in (RAS or LPS)

  # Applies to every recon_target_distance_* id (cli.py falls back from the id
  # to the stage name). `units` is only a label - it does not rescale anything;
  # it has to match whatever frame that id's landmarks_path is in, which for
  # all of them is align_to_reference's aligned_landmarks (original scan mm).
  # `landmark_metric` is the 3x3 M of the landmark Mahalanobis distance in
  # landmark_distances.json; unset it is the identity, i.e. Euclidean.
  # The overlay stage reads back meshes recon_target_distance wrote, so it
  # inherits that stage's frame - but not its config, hence the same label
  # again here (its own default still says "landmark frame units").
  distance_distribution_overlay:
    units: mm (original scan frame)
    coverage_thresholds: [1.0, 2.0, 3.0]

  recon_target_distance:
    units: mm (original scan frame)
    # Share of points within each of these distances, per direction. In the
    # units above, so these are millimetres.
    coverage_thresholds: [1.0, 2.0, 3.0]
    landmark_metric: []

  roughness_filter:
    n_rings: 5
    scale_invariant: false
    method: quadric
    threshold: 0.9
    neighbors: knn
    max_neighbors: 32
    min_bridge_width: 0
    min_bridge_relative: false

  landmark_bbox_cut:
    x_min_offset_mm: 10.0
    x_max_offset_mm: 10.0
    y_min_offset_mm: 3.0
    y_max_offset_mm: 35.0
    z_min_offset_mm: 20.0
    z_max_offset_mm: 5.0
    keep_largest_component: false
    min_bridge_width: 0
    min_bridge_relative: false

  scan_consistency:
    sigma_mm: 2.0
    apply_denoise_threshold: true
    min_consistency_threshold: [0.99, 0.9, 0.7, 0.8, 0.6, 0.5, 0.3, 0.2]
    denoise_min_bridge_width: 0
    denoise_min_bridge_relative: true

  # ---------------------------------------------------------------------
  # The one set of SSM-fitting hyperparameters
  ssm_fit: &ssm_fit_common
    steps:
      gmm_2_template: false
      align: true
      landmark_fit: true
      nicp: true
      laplacian: false
    model:
      normalize: false
      atlas:
        # FetusModel_x4 only has 13 of the 19 baby landmarks annotated;
        # Read for the fetus models only
        landmarks: ${PROJECT_ROOT}/src/SSM/FetusModel_x4/landmarks.json
    rigid:
      iterations: 10
      landmark_fit_learning_rate: 1.0
      allow_scale: true
    nicp: &nicp_common
      save_every: 1
      defaults: {}
      fits:
        - &fit_map
          name: map
          correspondence:
            name: constrained
            kwargs: {max_dist: 10.0, normal_thresh_deg: 60.0, k: 50,
                     use_target_normals: true, one_to_one: true}
          loss:       {name: matched_l2, kwargs: {reduction: mean}}
          prior:      {name: none}        # replaced per model
          projection: {name: none}
          solver: {name: normal_equations,
                   kwargs: {iterations: 10, learning_rate: 1.0, damping: 0}}
          refresh_every: 1          # re-match every round: this is the ICP loop

        # -- weighted point-to-plane chamfer: no correspondence ---------------
        - &fit_p2plane_chamfer
          name: p2plane_chamfer
          correspondence: {name: none}
          loss:
            name: p2plane_chamfer
            kwargs:
              source_to_target: {weight: 1.0, base_sigma: 1.0}
              target_to_source: {weight: 5.0, base_sigma: 1.0}
              plane_weight: 0.8
              p: 2
              source_ratio: 0.0
              target_ratio: 0.25   # thin the scan; the search is linear in it
              # E_stiff of the classical NICP energy: the mean squared strain of
              # the displacement field over the mesh edges,
              #   mean_(i,j) ||d_i - d_j||^2 / ||xbar_i - xbar_j||^2,  d = x(a) - xbar.
              # A translation costs nothing; stretching and bending the template
              # does. Divided by the rest edge length it is dimensionless, so one
              # value means the same on the fetus and the baby model despite the
              # ~5000x scale gap between them. 0 disables the term.
              stiffness: 0.0
          projection: {name: none}
          # prior is supplied per model below - it is the one hyperparameter
          # that cannot be shared, see the calibration note.
          solver: {name: gradient,
                   kwargs: {optimizer: adam, lr: 1.0e-1, iterations: 10,
                            tolerance: 1.0e-8, patience: 5, log_every: 25}}
          refresh_every: 0         # no effect: this loss re-pairs every evaluation
    verbose: true

  scan_fusion_ssm:
    sigma_mm: 2  # spatial tolerance in mm; subject points within sigma_mm pull a reference vertex toward them
    min_support: 0.0001  # reference vertices with total kernel weight below this are dropped (too little cross-subject agreement)
    normal_power: 1
    surface_fit_n_rings: 5
    surface_fit_method: quadric  # "plane" | "quadric"
    compute_roughness: false

  # ---------------------------------------------------------------------
  # The per-model chamfer prior, the one thing that cannot be shared.
  #
  # `mahalanobis` is the model's own Gaussian prior: alpha ~ N(0, Lambda), so
  # the penalty sum(alpha_i^2 / lambda_i) is its negative log density. This
  # project stores the UNWHITENED alpha (the basis is normalised and does not
  # absorb sqrt(Lambda) - see src/SSM/model/model.py::reconstruct), which is why
  # the isotropic prior is not the matching one here: with normalize:true this
  # is exactly an isotropic penalty on the whitened z_i = alpha_i/sqrt(lambda_i).
  #
  # Each weight is solved from the closed form in
  # theory/shape_deformation_models.tex, "Expected chi2_crit through
  # MAP-estimation": under u = Psi Lam^1/2 z + eps with eps ~ N(0, sn^2 I),
  #
  #     E[||z||^2 | u] = ||z_hat||^2 + tr(Sigma_z)
  #
  # which falls monotonically in sn^2 from ||z_ML||^2 to L. The weight below is
  # the root of E[||z||^2 | u] = chi2.ppf(0.99, L) - the same 99% ellipsoid the
  # `clamped` fit's mahalanobis_clamp enforces - converted to this config's
  # units by w = sn^2 / (lambda_max * P), where P is the matched-pair count:
  # the closed form assumes a SUMMED likelihood, and both losses here average,
  # which scales the data term by 1/P and the prior weight with it. So each
  # model is regularised exactly enough that its EXPECTED plausibility radius,
  # posterior variance included, sits on the 99% level rather than past it.
  #
  # map_<n>x is n TIMES THE CALIBRATED WEIGHT for that model, not a weight of n:
  # map_1x is the solved value below, and the sweep brackets it 0.25x .. 4x. A
  # literal weight of 1.0 would be a different reference - under normalize:true
  # it restrains the dominant mode exactly as isotropic weight 1 would - and has
  # no reason to coincide with the MAP value, which is set by the scan noise.
  #
  # The weights are not comparable between models: they depend on L, on the
  # eigenvalue spectrum and on the domain's units. Calibrated on subject 2's
  # merged scan - the only preprocessed subject - so re-run the calibration if
  # the preprocessing or the scan set changes.
  # ---------------------------------------------------------------------

  # L=183 modes, chi2_99=230.4, sigma_n^2=10.13, lambda_max=1.86, P=2058 pairs
  fetus_ssm_fit_init_pca:
    <<: *ssm_fit_common
    nicp:
      <<: *nicp_common
      fits: [
            #{<<: *fit_map, name: map_0.25x,
             # prior: {name: mahalanobis, kwargs: {weight: 0.0006614, normalize: true}}},
            # {<<: *fit_map, name: map_0.5x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.001323, normalize: true}}},
             {<<: *fit_map, name: map_1x,
              prior: {name: mahalanobis, kwargs: {weight: 0.002646, normalize: true}}},
            # {<<: *fit_map, name: map_2x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.005291, normalize: true}}},
            # {<<: *fit_map, name: map_4x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.01058, normalize: true}}},
            # {<<: *fit_p2plane_chamfer,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.034147, normalize: true}}}
              
              ]

  # L=113 modes, chi2_99=150.9, sigma_n^2=398.1, lambda_max=0.6005, P=1643 pairs
  fetus_ssm_fit_init_pca_times_gaussian:
    <<: *ssm_fit_common
    nicp:
      <<: *nicp_common
      fits: [
            #{<<: *fit_map, name: map_0.25x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.1009, normalize: true}}},
            # {<<: *fit_map, name: map_0.5x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.2018, normalize: true}}},
             {<<: *fit_map, name: map_1x,
              prior: {name: mahalanobis, kwargs: {weight: 0.4035, normalize: true}}},
            # {<<: *fit_map, name: map_2x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.8071, normalize: true}}},
            # {<<: *fit_map, name: map_4x,
            #  prior: {name: mahalanobis, kwargs: {weight: 1.614, normalize: true}}},
            # {<<: *fit_p2plane_chamfer,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.17322, normalize: true}}}
              ]

  # L=106 modes, chi2_99=142.8, lambda_max=2.03, sigma_n^2 and P not solved.
  # Borrows fetus PCA's weight for the same reason its baby counterpart borrows
  # baby PCA's - see that block. lambda_max 2.03 vs 1.86 is close, but L 106 vs
  # 183 is not, so this one is the weaker of the two borrowings.
  fetus_ssm_fit_init_pca_sum_matern32:
    <<: *ssm_fit_common
    nicp:
      <<: *nicp_common
      fits: [
             {<<: *fit_map, name: map_1x,
              prior: {name: mahalanobis, kwargs: {weight: 0.002646, normalize: true}}}
              ]

  # L=165 modes, chi2_99=210.2, sigma_n^2=51.78, lambda_max=0.3989, P=2070 pairs
  fetus_ssm_fit_init_pca_times_wendland:
    <<: *ssm_fit_common
    nicp:
      <<: *nicp_common
      fits: [
            #{<<: *fit_map, name: map_0.25x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.01568, normalize: true}}},
            # {<<: *fit_map, name: map_0.5x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.03136, normalize: true}}},
             {<<: *fit_map, name: map_1x,
              prior: {name: mahalanobis, kwargs: {weight: 0.06271, normalize: true}}},
            # {<<: *fit_map, name: map_2x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.1254, normalize: true}}},
            # {<<: *fit_map, name: map_4x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.2508, normalize: true}}},
            # {<<: *fit_p2plane_chamfer,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.19677, normalize: true}}},
             # -- constrained instead of penalised --------------------------------
             #{<<: *fit_map, name: tr_map,
             # solver: {name: trust_region,
             #          kwargs: {p: 0.99, constrain: expected, iterations: 10}}},
             # Same constraint on the chamfer. tr(Sigma_z) comes from autograd
             # here rather than from an assembled normal matrix (see _curvature),
             # computed once per ICP round at the warm start; hessian_refresh:
             # true recomputes it at every bracket step, at ~10x the cost.
             #{<<: *fit_p2plane_chamfer, name: tr_chamfer,
             # solver: {name: trust_region,
             #          kwargs: {p: 0.99, constrain: expected, iterations: 5,
             #                   inner_iterations: 25, outer_iterations: 10,
              #                  lr: 1.0e-1}}}
              ]

  # L=163 modes, chi2_99=207.9, sigma_n^2=1.6e-06, lambda_max=2.178e-08, P=4783 pairs
  baby_ssm_fit_init_pca: &ssm_fit_baby_pca
    <<: *ssm_fit_common
    nicp:
      <<: *nicp_common
      fits: [
            #{<<: *fit_map, name: map_0.25x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.00384, normalize: true}}},
            # {<<: *fit_map, name: map_0.5x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.007679, normalize: true}}},
             {<<: *fit_map, name: map_1x,
              prior: {name: mahalanobis, kwargs: {weight: 0.01536, normalize: true}}},
            # {<<: *fit_map, name: map_2x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.03072, normalize: true}}},
            # {<<: *fit_map, name: map_4x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.06143, normalize: true}}},
            # {<<: *fit_p2plane_chamfer,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.16467, normalize: true}}}
            ]

  # L=196 modes, chi2_99=245.0, sigma_n^2=7.398e-06, lambda_max=9.282e-09, P=4051 pairs
  baby_ssm_fit_init_pca_times_gaussian: &ssm_fit_baby_pca_times_gaussian
    <<: *ssm_fit_common
    nicp:
      <<: *nicp_common
      fits: [
            #{<<: *fit_map, name: map_0.25x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.04919, normalize: true}}},
            # {<<: *fit_map, name: map_0.5x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.09837, normalize: true}}},
             {<<: *fit_map, name: map_1x,
              prior: {name: mahalanobis, kwargs: {weight: 0.1967, normalize: true}}},
            # {<<: *fit_map, name: map_2x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.3935, normalize: true}}},
            # {<<: *fit_map, name: map_4x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.787, normalize: true}}},
            # {<<: *fit_p2plane_chamfer,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.41725, normalize: true}}}
              ]

  # L=226 modes, chi2_99=278.4, sigma_n^2=1.031e-05, lambda_max=6.726e-09, P=4012 pairs
  baby_ssm_fit_init_pca_times_wendland: &ssm_fit_baby_pca_times_wendland
    <<: *ssm_fit_common
    nicp:
      <<: *nicp_common
      fits: [
            # {<<: *fit_map, name: map_0.25x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.09549, normalize: true}}},
            # {<<: *fit_map, name: map_0.5x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.191, normalize: true}}},
             {<<: *fit_map, name: map_1x,
              prior: {name: mahalanobis, kwargs: {weight: 0.382, normalize: true}}},
            # {<<: *fit_map, name: map_2x,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.7639, normalize: true}}},
            # {<<: *fit_map, name: map_4x,
            #  prior: {name: mahalanobis, kwargs: {weight: 1.528, normalize: true}}},
            # {<<: *fit_p2plane_chamfer,
            #  prior: {name: mahalanobis, kwargs: {weight: 0.4557, normalize: true}}}
            ]

  # L=158 modes, chi2_99=202.3, lambda_max=2.478e-08, sigma_n^2 and P not solved.
  # Every other weight here is sigma_n^2 / (P * lambda_max) from its own
  # calibration run; this model's was never solved, so it borrows baby PCA's
  # verbatim - the two spectra are close enough for that to be the least-bad
  # fallback (lambda_max 2.478e-08 vs 2.178e-08, L 158 vs 163), but it is a
  # borrowed number, not a calibrated one. Re-run the calibration before
  # reading much into how this model ranks against the others.
  baby_ssm_fit_init_pca_sum_matern32: &ssm_fit_baby_pca_sum_matern32
    <<: *ssm_fit_common
    nicp:
      <<: *nicp_common
      fits: [
           # {<<: *fit_map, name: map_0.25x,
           #   prior: {name: mahalanobis, kwargs: {weight: 0.00384, normalize: true}}},
           #  {<<: *fit_map, name: map_0.5x,
           #   prior: {name: mahalanobis, kwargs: {weight: 0.007679, normalize: true}}},
             {<<: *fit_map, name: map_1x,
              prior: {name: mahalanobis, kwargs: {weight: 0.01536, normalize: true}}},
           #  {<<: *fit_map, name: map_2x,
           #   prior: {name: mahalanobis, kwargs: {weight: 0.03072, normalize: true}}},
           #  {<<: *fit_map, name: map_4x,
           #   prior: {name: mahalanobis, kwargs: {weight: 0.06143, normalize: true}}}
              ]

  # The post-fusion baby fits reuse their model's weight verbatim. It was
  # calibrated against the merged scan rather than the fused one, which does
  # not exist until scan_fusion_ssm has run.
  baby_ssm_fit_pca:                   *ssm_fit_baby_pca
  baby_ssm_fit_pca_times_gaussian:    *ssm_fit_baby_pca_times_gaussian
  baby_ssm_fit_pca_times_wendland:    *ssm_fit_baby_pca_times_wendland
  baby_ssm_fit_pca_sum_matern32:      *ssm_fit_baby_pca_sum_matern32


  similarity_transform:
    heatmap_prefix: heatmap_
    landmarks_frame: LPS  # frame the landmark CSVs are written in (RAS or LPS)
    with_scale: true

  resnet_lddmm_train:
    field:
      kind: time_varying
      num_steps: 10
      mlp: [128,128,128]
      activation: relu
    code:
      kind: none
      position_aware: true
      conditioning_method: concat
      grid: 16
    loss:
      #data_name: field_weighted_chamfer
      data_name: field_weighted_point2plane_chamfer
      data_kwargs:
        #seems to measure how well the template fits the target
        source_to_target:
          weight: 1
          base_sigma: 0.01
          field_name: landmark_weight
