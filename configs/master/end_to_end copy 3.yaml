#---------------------Fit summaries: the distance distributions of several fits
#                     overlaid as lines, one .png per direction.
#
# NB: ' + ' is this file's path-concatenation operator (see pipeline/config.py),
# so 'PCA sum Matern32' is spelled out in the labels below rather than written
# as 'PCA + Matern32', whose surrounding spaces would be eaten.

  # Everything measured against the merged high-confidence scan (185,567 pts):
  # the two LDDMM runs' eval_high_confidence, and the pre-fusion SSM MAP fits,
  # whose rigid_alignment.vtp IS that scan carried into model space (a separate
  # copy per fit, same scan, and recon_target_distance normalises all of them
  # into the subject's landmark frame). This is the LDDMM-vs-pre-fusion-SSM
  # comparison. Read target->recon here as "how much of the raw high-confidence
  # scan does this reconstruction explain", which is a harsher and more literal
  # question than the fused-target summary asks.
  # The pre-fusion sweep on its own: each domain's mean shape (the surface every
  # model in that domain starts from, before any fitting) against what the two
  # kernels do to it. Every source here is a pre-fusion eval, so all six already
  # share one target - the merged high-confidence scan - and both directions are
  # comparable across the whole set.
  fit_summary_prefusion_ssm:
    sources:
      - label: Fetus mean shape
        eval_dir: recon_target_distance_fetus_init_mean_shape.output_dir
      - label: Fetus PCA (MAP)
        eval_dir: recon_target_distance_fetus_init_pca_map.output_dir
      - label: Fetus PCA sum Matern32 (MAP)
        eval_dir: recon_target_distance_fetus_init_pca_sum_matern32_map.output_dir
      - label: Baby mean shape
        eval_dir: recon_target_distance_baby_init_mean_shape.output_dir
      - label: Baby PCA (MAP)
        eval_dir: recon_target_distance_baby_init_pca_map.output_dir
      - label: Baby PCA sum Matern32 (MAP)
        eval_dir: recon_target_distance_baby_init_pca_sum_matern32_map.output_dir
    output_dir: ${PROJECT_ROOT}/outputs/fit_summaries/${SUBJECT_ID}/prefusion_ssm
    log_y: true

  fit_summary_high_confidence_target:
    sources:
      - label: LDDMM from baby mean
        eval_dir: recon_target_distance_baby_mean_lddmm_high_confidence.output_dir
      - label: LDDMM from baby SSM
        eval_dir: recon_target_distance_baby_ssm_lddmm_high_confidence.output_dir
      - label: Baby SSM PCA (MAP)
        eval_dir: recon_target_distance_baby_init_pca_map.output_dir
      - label: Baby SSM PCA sum Matern32 (MAP)
        eval_dir: recon_target_distance_baby_init_pca_sum_matern32_map.output_dir
      - label: Fetus SSM PCA (MAP)
        eval_dir: recon_target_distance_fetus_init_pca_map.output_dir
      - label: Fetus SSM PCA sum Matern32 (MAP)
        eval_dir: recon_target_distance_fetus_init_pca_sum_matern32_map.output_dir
    output_dir: ${PROJECT_ROOT}/outputs/fit_summaries/${SUBJECT_ID}/high_confidence_target
    log_y: true

  # Everything measured against the fused scan (5,743 pts): the LDDMM runs' own
  # eval, and the post-fusion SSM MAP fits. target->recon is much smaller here
  # than in the high-confidence summary - fusion removed the material that the
  # other one charges for - so the two summaries' target->recon plots are not
  # on a common scale.
  fit_summary_fused_target:
    sources:
      - label: LDDMM from baby mean
        eval_dir: recon_target_distance_baby_mean_lddmm.output_dir
      - label: LDDMM from baby SSM
        eval_dir: recon_target_distance_baby_ssm_lddmm.output_dir
      - label: Baby SSM PCA (MAP)
        eval_dir: recon_target_distance_baby_pca_map.output_dir
      - label: Baby SSM PCA sum Matern32 (MAP)
        eval_dir: recon_target_distance_baby_pca_sum_matern32_map.output_dir
    output_dir: ${PROJECT_ROOT}/outputs/fit_summaries/${SUBJECT_ID}/fused_target


#---------------------ResNetLDDMM with from the fetus mean to the scan_fusion from the fetus_ssm
