  #-- Baby PCA + Matern-3/2 (pre-fusion)

  recon_target_distance_baby_init_pca_sum_matern32_map:
    target_path: baby_ssm_fit_init_pca_sum_matern32.outputs.dir + /rigid_alignment.vtp
