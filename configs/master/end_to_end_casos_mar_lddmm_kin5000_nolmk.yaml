      mesh_vtp: scan_consistency.output_merged_dir + /merged_high_confidence_scan_threshold_0.8.vtp
      landmarks_json: align_to_template.out_landmarks_csv_dir
      template_vtp: ${PROJECT_ROOT}/assets/templates/fetus_mean.vtp
    outputs:
