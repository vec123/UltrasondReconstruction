hyperparameters:
  nrrd_to_vtp:
    contour_value: 70
    auto_contour: false
    reduction_factor: 0.1
    min_bridge_width: 0
    min_bridge_relative: false
    compute_curvedness: false
    curvedness_n_rings: 5
    curvedness_scale_invariant: false
    operators: false
    k_eig: 200
    flat:
      enabled: false
      n_rings: 5
      thresh: 0.1
      max_area: 0.05
