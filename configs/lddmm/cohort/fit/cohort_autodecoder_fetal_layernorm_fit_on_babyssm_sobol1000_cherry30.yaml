# Fit of the LayerNorm BabySSM flow (cohort_autodecoder_babyssm_sobol1000_global_l2_mlp6x256_layernorm_kin200.yaml,
# final) to the 30 cherry-tree fused targets: the flow is frozen except its LayerNorm affines
# (gamma, beta: 6 x 2 x 256 values), which are SHARED over the cohort; each target has its own code.
#
# So the targets can move the decoder only through 3072 shared values, and the codes keep
# the statistics of the baby flow. Two penalties keep the flow near the trained one:
#   * field_change_kinetic (200, = kinetic_weight): 1/2 int mean ||v - v0||^2 dt along the
#     trajectory, on every flowed template point, seen by a scan or not;
#   * parameter_anchor (0.01): sum (p - p0)^2 over the free affines, a weak pull back.
#
# Data term, targets and frame as the stage-2 run
# (cohort_autodecoder_fetal_residual_split_on_babyssm_sobol1000.yaml). code_reg_weight
# 1.67 = 0.05 x 1000 / 30: the training's prior per member (see the test200 code fit).
# The 10 cases of outputs/Casos_Mar/challenging_cases.json are not in the 30.
#
# Inputs: /home/victor/Escritorio/Data/fused_targets/cherry_30 links the 30 names of
# outputs/Casos_Mar/cohort/fused_targets_4096_fields_cherry_tree to ../targets (BabySSM frame).
#
# Run with:
#    python scripts/run.py configs/lddmm/cohort/fit/cohort_autodecoder_fetal_layernorm_fit_on_babyssm_sobol1000_cherry30.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets/cherry_30
target: /home/victor/Escritorio/Data/fused_targets/template.vtp
frame_source: /home/victor/Escritorio/Data/BabySSMData_sobol1000/members
output_dir: ${PROJECT_ROOT}/outputs/stage2_flow/babyssm-sobol1000-mlp6x256-layernorm-kin200_free-layernorm-shared_fieldchange200_anchor0.01_code128_codereg1.67_edgeweight3sp-template2scan_cherry30

field:                              # = the trained flow's
  kind: stationary_fourier
  num_steps: 20
  mlp: [256, 256, 256, 256, 256, 256]
  activation: relu
  norm: layer
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}   # never lowers alpha: stays at the checkpoint's 3

code:
  kind: auto_decoder
  n_z: 128
  position_aware: false

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight   # x edge_weight of the nearest scan point: rim matches stop pulling
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support           # fusion support only: every scan point has a counterpart on the template
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 200.0
  code_reg_weight: 1.67             # 0.05 x 1000 / 30, see the header
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward
  terms:
    - kind: field_change_kinetic
      weight: 200.0
    - kind: parameter_anchor
      weight: 0.01
      kwargs: {pattern: norm}

train:
  mode: cohort
  steps: 3000
  batch: 30                         # = cohort size: every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
  freeze_flow: true
  freeze_flow_except: [norm]        # the LayerNorm affines, shared over the cohort

init:
  checkpoint: ${PROJECT_ROOT}/outputs/baby_ssm_cohort/resnet_lddmm_cohort_autodecoder_sobol1000_global_l2_mlp6x256_layernorm_kin200/checkpoints/final.pt
  parts: [flow]
  continue_step_count: false
  code_init: mean
