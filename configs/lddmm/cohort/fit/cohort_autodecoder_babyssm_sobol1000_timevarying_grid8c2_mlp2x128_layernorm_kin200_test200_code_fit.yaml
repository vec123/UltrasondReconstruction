# Test200 code fit of cohort_autodecoder_babyssm_sobol1000_timevarying_grid8c2_mlp2x128_layernorm_kin200.yaml
# (final, time-varying field, position-aware grid code): same recipe as the stationary
# grid8c2 test200 code fit, with the time-varying field (mlp [128, 128] per block) instead.
#
# Run with:
#    python scripts/run.py configs/lddmm/cohort/fit/cohort_autodecoder_babyssm_sobol1000_timevarying_grid8c2_mlp2x128_layernorm_kin200_test200_code_fit.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/BabySSMData_test200/members
frame_source: /home/victor/Escritorio/Data/BabySSMData_sobol1000/members
target: /home/victor/Escritorio/Data/BabySSMData_sobol1000/template.vtp
output_dir: ${PROJECT_ROOT}/outputs/baby_ssm_cohort/resnet_lddmm_cohort_autodecoder_sobol1000_timevarying_grid8c2_mlp2x128_layernorm_kin200_test200_code_fit

field:
  kind: time_varying_fourier
  num_steps: 20
  mlp: [128, 128]
  activation: relu
  norm: layer
  grad_checkpointing: true
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}

code:
  kind: auto_decoder
  n_z: 1024
  position_aware: true
  grid: 8
  grid_channels: 2
  grid_direct: true
  grid_reg:
    kind: distance
    low: 0.0
    high: 1.0
    near: 0.5
    far: 1.0

loss:
  data_name: l2
  sigma: 0.01
  kinetic_weight: 200.0
  code_reg_weight: 0.01    # as training: a per-node (grid_reg), not per-member, penalty
  landmark_weight: 0.0
  subsample_M: 500
  direction: forward

train:
  mode: cohort
  steps: 2000
  batch: 200
  lr: 0.0001
  seed: 42
  log_every: 50
  save_every: 1000
  export_shapes: 4
  export_strategy: sequential
  device: cuda
  freeze_flow: true

init:
  checkpoint: ${PROJECT_ROOT}/outputs/baby_ssm_cohort/resnet_lddmm_cohort_autodecoder_sobol1000_timevarying_grid8c2_mlp2x128_layernorm_kin200/checkpoints/final.pt
  parts: [flow]
  continue_step_count: false
  code_init: mean
