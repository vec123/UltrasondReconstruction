# cohort_autodecoder_casos_mar_fieldweighted_direct_g8c2_dist_kin8000_cherry_fit_holdout.yaml with a code prior by distance to the face: every node is pulled towards
# the cherry code mean (init.code_prior: mean), with weight 2 within 1 grid cell of the
# central face landmarks, rising to 30 from 2 cells on (cheeks, temples, outer region).
#
# Run with:
#    python scripts/run_stage.py --config configs/lddmm/cohort/fit/cohort_autodecoder_casos_mar_fieldweighted_direct_g8c2_dist_kin8000_cherry_fit_holdout_face30.yaml

stage: resnet_lddmm_train

variables:
  DATASET: Casos_Mar

source: ${OUT}/cohort/fused_targets_4096_fields_fit_holdout
frame_source: ${OUT}/cohort/fused_targets_4096_fields_cherry_tree
target: ${OUT}/cohort/template_baby_mean_aligned.vtp
output_dir: ${OUT}/resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g8c2_dist_kin8000_cherry_fit_holdout_face30

field:
  kind: time_varying_fourier
  num_steps: 20
  mlp: [128, 128]
  activation: relu
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}

code:
  kind: auto_decoder
  n_z: 1024
  position_aware: true
  grid: 8
  grid_channels: 2
  grid_direct: true
  grid_reg:
    kind: face_distance
    labels: [n, prn, sn, ls, li, sl, pg, enL, enR, chL, chR, aL, aR]   # the face centre
    low: 2.0               # face centre: a mild pull towards the code mean
    high: 30              # cheeks, temples, outer region: a strong pull
    near: 1.0              # cells from the nearest face landmark up to which a node gets low
    far: 2.0               # cells from which a node gets high

loss:
  # As the pair runs (end_to_end_casos_mar.yaml, resnet_lddmm_train).
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 8000.0
  code_reg_weight: 0.15    # 0.01 * 30 / 2, see the header
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 1000
  batch: 1000            # >= cohort size: every step uses every target with its own code
  lr: 0.001              # codes only: higher than in training
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
  freeze_flow: true

init:
  checkpoint: ${OUT}/resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g8c2_dist_kin8000_cherry/checkpoints/final.pt
  parts: [flow]
  continue_step_count: false
  code_init: mean
  code_prior: mean
