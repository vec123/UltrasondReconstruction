# Applies the shared-flow run (5 shared steps, discount once, full-rank linear atlas field)
# to every member and to the mean of all member codes (<run>/apply/mean_recon). The zero
# code of this run is the atlas psi(template), so the distance of mean_recon from the
# atlas shows how far the mean code is from 0.
#
# Run with:
#    python scripts/run.py configs/lddmm/cohort/apply/cohort_autodecoder_direct_timevarying_full313_train281_kin200_det10_codereg_atlas_linear_rankfull_shared5_discountonce_apply.yaml

stage: resnet_lddmm_apply

variables:
  RUN: ${PROJECT_ROOT}/outputs/atlas_flow/timevarying-mlp2x128-atlaslinear-rankfull-shared5steps-sharedprice1overM-kin200-det10_code128_codereg0.01_edgeweight3sp-template2scan_full313_train281

train_config: ${RUN}/config.json
checkpoint: ${RUN}/checkpoints
device: cuda
shapes: null
mean_code: true
export:
  deformed: true
  trajectory: false
  references: true
  spaces: [world]
