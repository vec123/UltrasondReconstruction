# Applies the field-weighted, grid-4 cohort auto-decoder run
# (cohort_autodecoder_casos_mar_fieldweighted_direct_g4c8_dist.yaml): deforms its template, at full
# resolution, once per cohort member with that member's learned code, into
# <output_dir>/<member>/{world,normalized}/deformed.vtp.
#
# Run with:
#    python scripts/run.py configs/lddmm/cohort/apply/cohort_autodecoder_casos_mar_fieldweighted_direct_g4c8_dist_apply.yaml

stage: resnet_lddmm_apply

variables:
  DATASET: Casos_Mar

train_config: ${OUT}/resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g4c8_dist/config.json
checkpoint: ${OUT}/resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g4c8_dist/checkpoints
device: cuda
shapes: null   # every member
export:
  deformed: true
  trajectory: false
  references: true
  spaces: [world]
