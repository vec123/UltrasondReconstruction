# Applies the field-weighted, grid-4 cohort auto-decoder run
# (cohort_autodecoder_casos_mar_fieldweighted_direct_g4c8.yaml): deforms its template, at full
# resolution, once per cohort member with that member's learned code, into
# <output_dir>/<member>/{world,normalized}/deformed.vtp.
#
# Run with:
#    python scripts/run_stage.py --config configs/lddmm/cohort/apply/cohort_autodecoder_casos_mar_fieldweighted_direct_g4c8_apply.yaml

stage: resnet_lddmm_apply

train_config: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g4c8/config.json
checkpoint: ${PROJECT_ROOT}/outputs/Casos_Mar/resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g4c8/checkpoints
device: cuda
shapes: null   # every member
export:
  deformed: true
  trajectory: false
  references: true
  spaces: [world]
