# Direct, from-scratch training on fused_targets_full313/train (281 cases), using the
# recipe KNOWN to converge in 3000 steps from scratch: outputs/Casos_Mar/
# resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g8c2_dist_svf's architecture
# (position-aware 8x8x8x2 grid code, shallow 2x128 MLP, no LayerNorm, kinetic_weight
# 5000), not cohort_autodecoder_direct_full313_train281.yaml's (global code, deep
# 6x256 LayerNorm MLP, kinetic_weight 200): that one copied the stage-2 architecture
# for comparability, but a global code pushed through a deep LayerNorm MLP only
# sculpts real facial detail after BabySSM's own 18000-step pretraining - in 3000
# steps from scratch it undertrains and produces a smooth, under-detailed face even
# though its chamfer loss looks fine. The position-aware grid gives each facial
# region its own code channels, so detail appears quickly even from a random init
# (see outputs/Casos_Mar/resnet_lddmm_cohort_autodecoder_fieldweighted_direct_g8c2_dist_svf/
# code_distance_ranking.png).
#
# Run with:
#    python scripts/run_stage.py --config configs/lddmm/cohort/train/cohort_autodecoder_direct_grid_full313_train281.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets_full313/train
target: /home/victor/Escritorio/Data/fused_targets_full313/template.vtp
output_dir: ${PROJECT_ROOT}/outputs/direct_flow/grid8c2-mlp2x128-kin5000_codereg0.01dist_edgeweight3sp-template2scan_full313_train281

field:
  kind: stationary_fourier
  num_steps: 20
  mlp: [128, 128]
  activation: relu
  grad_checkpointing: true   # 281 members x 1000 subsample points don't fit in 16 GB without it
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}

code:
  kind: auto_decoder
  n_z: 1024
  position_aware: true
  grid: 8
  grid_channels: 2
  grid_direct: true
  grid_reg:
    kind: distance
    low: 0.0               # nodes near the face: free, as without regularisation
    high: 1.0              # nodes towards the boundary
    near: 0.5              # cells from the template up to which a node gets low
    far: 1.0               # cells from the template from which a node gets high

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 5000.0
  code_reg_weight: 0.01    # times the weighted sum(code^2); only the far nodes count
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 3000
  batch: 281               # = cohort size (train/): every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
