# Direct counterpart of cohort_autodecoder_fetal_layernorm_fit_on_babyssm_sobol1000_full313.yaml:
# same field architecture (stationary Fourier, mlp 6x256, LayerNorm, kinetic_weight 200 - the
# BabySSM pretraining's own recipe, "kin200"), same auto-decoder code (n_z 128) and the same
# 281 fused targets (train/) and template, but the flow is trained FROM SCRATCH on these
# shapes directly - no BabySSM init checkpoint, nothing frozen, no field_change_kinetic /
# parameter_anchor terms (those anchor a fine-tune to a frozen reference flow, which there is
# none of here). Its own joint-normalized frame (no frame_source): unlike the stage-2 run, no
# pretrained weights need to be met in BabySSM's frame.
#
# Run with:
#    python scripts/run_stage.py --config configs/lddmm/cohort/train/cohort_autodecoder_direct_full313_train281.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets_full313/train
target: /home/victor/Escritorio/Data/fused_targets_full313/template.vtp
output_dir: ${PROJECT_ROOT}/outputs/direct_flow/mlp6x256-layernorm-kin200_code128_codereg0.178_edgeweight3sp-template2scan_full313_train281

field:
  kind: stationary_fourier
  num_steps: 20
  mlp: [256, 256, 256, 256, 256, 256]
  activation: relu
  norm: layer
  grad_checkpointing: true
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}

code:
  kind: auto_decoder
  n_z: 128
  position_aware: false

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 200.0
  code_reg_weight: 0.178            # 0.05 x 1000 / 281, as the stage-2 run on the same cohort
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 3000
  batch: 281                        # = cohort size (train/): every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
