# cohort_autodecoder_direct_timevarying_full313_train281.yaml with a slight code
# regularisation (code_reg_weight 0.01, vs that run's 0.0): a light pull of the 281 codes
# toward the origin, well under the stage-2 runs' scaled prior (0.178 for this cohort size),
# to keep the code space well-conditioned without constraining the fit much.
#
# Run with:
#    python scripts/run.py configs/lddmm/cohort/train/cohort_autodecoder_direct_timevarying_full313_train281_codereg.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets_full313/train
target: /home/victor/Escritorio/Data/fused_targets_full313/template.vtp
output_dir: ${PROJECT_ROOT}/outputs/direct_flow/timevarying-mlp2x128-kin5000_code128_codereg0.01_edgeweight3sp-template2scan_full313_train281

field:
  kind: time_varying_fourier
  num_steps: 20
  mlp: [128, 128]
  activation: relu
  grad_checkpointing: true
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}

code:
  kind: auto_decoder
  n_z: 128
  position_aware: false

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 5000.0
  code_reg_weight: 0.01
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 3000
  batch: 281                        # = cohort size (train/): every step uses every target with its own code
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
