# The kin200/det10 recipe with a shared flow and a full-rank linear atlas field
# (fields/composite/shared.py, fields/composite/atlas.py): the first 5 of the 20 Euler
# steps are one shared flow, template -> atlas, the same for every member; the other 15
# are the member's flow, atlas -> member, linear in the code and zero at the zero code.
# So the zero code IS the atlas. The shared flow's kinetic price is discount 1:
# the price of a member's own flow.
# Everything else is as in ..._atlas_linear_rankfull.yaml.
#
# Run with:
#    python scripts/run.py configs/lddmm/cohort/train/cohort_autodecoder_direct_timevarying_full313_train281_kin200_det10_codereg_atlas_linear_rankfull_shared5_discount1.yaml

stage: resnet_lddmm_train

source: /home/victor/Escritorio/Data/fused_targets_full313/train
target: /home/victor/Escritorio/Data/fused_targets_full313/template.vtp
output_dir: ${PROJECT_ROOT}/outputs/atlas_flow/timevarying-mlp2x128-atlaslinear-rankfull-shared5steps-sharedprice1-kin200-det10_code128_codereg0.01_edgeweight3sp-template2scan_full313_train281

field:
  kind: time_varying_fourier
  num_steps: 20
  mlp: [128, 128]
  activation: relu
  grad_checkpointing: true
  fourier_n_e: 3
  fourier_anneal: {start: 1500, end: 2700}
  atlas: {mode: linear, rank: full}
  shared: {steps: 5, discount: 1}

code:
  kind: auto_decoder
  n_z: 128
  position_aware: false

loss:
  data_name: field_weighted_point2plane_chamfer
  data_kwargs:
    source_to_target:
      weight: 1
      base_sigma: 0.01
      field_name: landmark_weight
      inherit_target_field: edge_weight
      loss_distance_handle: {kind: truncated, breakpoint: 0.1, power: 1}
    target_to_source:
      weight: 1
      base_sigma: 0.01
      field_name: support
      inherit_source_field: false
      loss_distance_handle: {kind: quadratic, breakpoint: 0.1, power: 2}
  kinetic_weight: 200.0
  code_reg_weight: 0.01
  isometry_weight: 10.0
  isometry_type: det
  landmark_weight: 0.0
  subsample_M: 1000
  direction: forward

train:
  mode: cohort
  steps: 3000
  batch: 281
  lr: 0.0001
  seed: 42
  log_every: 10
  save_every: 500
  export_shapes: 4
  export_strategy: sequential
  device: cuda
