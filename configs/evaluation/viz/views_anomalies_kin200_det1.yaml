# python scripts/run.py configs/evaluation/viz/views_anomalies_kin200_det1.yaml
#
# One PNG per anomaly session into the views/ folder of the code fit of
# configs/code_fit/fused_target_anomalies_kin200_det1.yaml (src/evaluation/stages/render_views.py):
# the fused target from the front, then the fitted model from the front, the patient's left
# and right. The cameras come from the heatmap fields of the fused target (the first column).
# Both meshes are in the scans' frame (mm).
stage: render_views

variables:
  ANOMALIES: ${DATA_ROOT}/fused_scans_anomalies
  FITS: ${PROJECT_ROOT}/outputs/direct_flow/timevarying-mlp2x128-kin200-det1_code128_codereg0.01_edgeweight3sp-template2scan_full313_train281_anomalies_code_fit

paths:
  output_dir: ${FITS}/views

hyperparameters:
  views: [frontal, left, right]
  panel_px: 400
  overwrite: true
  columns:
  - title: Fused target
    mesh: ${ANOMALIES}/${SUBJECT_ID}/${WEEK}/fused_scan_ssm/fused_scan.vtp
    views: [frontal]
    tint: scan
  - title: Fit of the det1 kin200 flow
    mesh: ${FITS}/${SUBJECT_ID}/${WEEK}/fit.vtp
