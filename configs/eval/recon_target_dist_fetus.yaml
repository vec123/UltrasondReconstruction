# Eval/QC tool, not part of the pipeline.yaml chain: nearest-neighbor (L2)
# point-to-point distance between a reconstruction and its registration
# target, in both directions. Doesn't move geometry, so it saves no transform.
#
# Usage: python scripts/US/run_stage.py --config configs/eval/recon_target_dist_fetus.yaml
stage: recon_target_distance

target_path: ${PROJECT_ROOT}/Results/fetus_ssm_outputs/1/high_conf_scan/merged_high_confidence_scan_threshold_0.8/rigid_alignment.vtp
recon_path: ${PROJECT_ROOT}/Results/fetus_ssm_outputs/1/high_conf_scan/merged_high_confidence_scan_threshold_0.8/nicp_refined_vertices_gamma_2_iter_0008.vtp

# align_to_template's saved transforms for subject 1 (one per sweep) - the
# median scale over them converts distances from template units back to the
# original data's physical scale, comparable against baby_ssm_outputs.
# subject_id below picks the SAME sweep as recon_target_dist_baby.yaml to
# fully invert (rotation+translation+scale), placing the saved meshes back
# in the ORIGINAL scan's own frame (both runs share the identical raw
# isosurface, verified by md5), so the two datasets' outputs overlap.
transforms_dir: ${PROJECT_ROOT}/US_samples/VTK_fetus_template_1/1/20_semanas/aligned_to_template/transforms
subject_id: 1-20s-01

# target_w_distance.vtp / recon_w_distance.vtp are saved here. Left unset,
# saves next to target_path / recon_path instead.
output_dir: ${PROJECT_ROOT}/Eval/fetus_ssm_outputs/1/fetus_ssm_eval/merged_high_confidence_scan_threshold_0.8

