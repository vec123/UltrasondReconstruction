    output_path: resnet_lddmm_train_baby_ssm.output_dir + /overlay/recon_overlay.nrrd
    label_maps_dir: resnet_lddmm_train_baby_ssm.output_dir + /overlay/recon_overlay_labels
    layers:
      # Final LDDMM reconstructions -- one per template/model combo trained above.
      # The transform back into the raw NRRD's frame is the same for every layer
      # below, so it is written once here and aliased thereafter.
      - vtp_path: resnet_lddmm_apply_baby_ssm.output_dir + /world/deformed.vtp
        name: Reconstruction (Baby SSM)
        line_color: [255, 255, 0]
        transform: &to_nrrd_frame
          manifest_dir: align_to_template.transforms_dir
          subject_id: ${REFERENCE_SCAN}
          apply_inverse: true
      - vtp_path: resnet_lddmm_apply_baby_mean.output_dir + /world/deformed.vtp
        name: Reconstruction (Baby Mean)
        line_color: [255, 165, 0]
        transform: *to_nrrd_frame
      - vtp_path: resnet_lddmm_apply_fetus_ssm.output_dir + /world/deformed.vtp
        name: Reconstruction (Fetus SSM)
        line_color: [0, 255, 255]
        transform: *to_nrrd_frame
      - vtp_path: resnet_lddmm_apply_fetus_mean.output_dir + /world/deformed.vtp
        name: Reconstruction (Fetus Mean)
        line_color: [255, 0, 255]
        transform: *to_nrrd_frame
      # Pre-LDDMM SSM fits -- the NICP baseline each LDDMM run started from,
      # useful to see how much the LDDMM step actually improved on the SSM fit.
      # Two objectives per model, same colour family so the pair reads as a
      # comparison: the lighter line is matched least squares, the darker one
      # the correspondence-free point-to-plane chamfer fitted from the same
      # starting shape against the same scan. One family per shape model.
      - vtp_path: fetus_ssm_fit_init_pca.outputs.dir + /nicp_refined_vertices_map_1x.vtp
        name: SSM Fit (Fetus init, PCA, MAP)
        line_color: [100, 180, 255]
        transform: *to_nrrd_frame
      - vtp_path: fetus_ssm_fit_init_pca.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
        name: SSM Fit (Fetus init, PCA, P2Plane Chamfer)
        line_color: [0, 90, 200]
        transform: *to_nrrd_frame
      - vtp_path: fetus_ssm_fit_init_pca_times_gaussian.outputs.dir + /nicp_refined_vertices_map_1x.vtp
        name: SSM Fit (Fetus init, PCA x Gaussian, MAP)
        line_color: [120, 230, 230]
        transform: *to_nrrd_frame
      - vtp_path: fetus_ssm_fit_init_pca_times_gaussian.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
        name: SSM Fit (Fetus init, PCA x Gaussian, P2Plane Chamfer)
        line_color: [0, 150, 150]
        transform: *to_nrrd_frame
      - vtp_path: fetus_ssm_fit_init_pca_times_wendland.outputs.dir + /nicp_refined_vertices_map_1x.vtp
        name: SSM Fit (Fetus init, PCA x Wendland, MAP)
        line_color: [150, 150, 255]
        transform: *to_nrrd_frame
      - vtp_path: fetus_ssm_fit_init_pca_times_wendland.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
        name: SSM Fit (Fetus init, PCA x Wendland, P2Plane Chamfer)
        line_color: [60, 60, 210]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_init_pca.outputs.dir + /nicp_refined_vertices_map_1x.vtp
        name: SSM Fit (Baby init, PCA, MAP)
        line_color: [255, 210, 120]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_init_pca.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
        name: SSM Fit (Baby init, PCA, P2Plane Chamfer)
        line_color: [210, 150, 0]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_init_pca_times_gaussian.outputs.dir + /nicp_refined_vertices_map_1x.vtp
        name: SSM Fit (Baby init, PCA x Gaussian, MAP)
        line_color: [255, 150, 110]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_init_pca_times_gaussian.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
        name: SSM Fit (Baby init, PCA x Gaussian, P2Plane Chamfer)
        line_color: [200, 80, 20]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_init_pca_times_wendland.outputs.dir + /nicp_refined_vertices_map_1x.vtp
        name: SSM Fit (Baby init, PCA x Wendland, MAP)
        line_color: [220, 180, 140]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_init_pca_times_wendland.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
        name: SSM Fit (Baby init, PCA x Wendland, P2Plane Chamfer)
        line_color: [150, 100, 40]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_pca.outputs.dir + /nicp_refined_vertices_map_1x.vtp
        name: SSM Fit (Baby fused, PCA, MAP)
        line_color: [255, 100, 180]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_pca.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
        name: SSM Fit (Baby fused, PCA, P2Plane Chamfer)
        line_color: [200, 0, 90]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_pca_times_gaussian.outputs.dir + /nicp_refined_vertices_map_1x.vtp
        name: SSM Fit (Baby fused, PCA x Gaussian, MAP)
        line_color: [230, 130, 255]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_pca_times_gaussian.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
        name: SSM Fit (Baby fused, PCA x Gaussian, P2Plane Chamfer)
        line_color: [150, 0, 210]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_pca_times_wendland.outputs.dir + /nicp_refined_vertices_map_1x.vtp
        name: SSM Fit (Baby fused, PCA x Wendland, MAP)
        line_color: [180, 120, 255]
        transform: *to_nrrd_frame
      - vtp_path: baby_ssm_fit_pca_times_wendland.outputs.dir + /nicp_refined_vertices_p2plane_chamfer.vtp
        name: SSM Fit (Baby fused, PCA x Wendland, P2Plane Chamfer)
        line_color: [110, 0, 230]
        transform: *to_nrrd_frame
      # Targets -- the fused cross-subject scan every LDDMM run trains toward,
      # and the single-subject merged scan it was itself fused from.
      - vtp_path: scan_fusion_ssm.output_dir + /fused_scan.vtp
        name: Target (Fused Scan)
        line_color: [0, 255, 0]
        transform: *to_nrrd_frame
      - vtp_path: scan_consistency.output_merged_dir + /merged_high_confidence_scan_threshold_0.8.vtp
        name: Merged Scan (Raw)
        line_color: [255, 255, 255]
        transform: *to_nrrd_frame
      # nrrd_to_vtp's own isosurface -- the very first stage's output, still in
      # the raw NRRD's own "original frame" (see that stage's module docstring),
      # so no transform is needed here: it already lines up with nrrd_path below.
      - vtp_path: nrrd_to_vtp.output_dir + /${REFERENCE_SCAN}.vtp
        name: Isosurface (Raw NRRD)
        line_color: [255, 0, 0]












  #---------Views (the last stage)
  render_views:
    output_dir: ${OUT}/views

#---------Hyperparameters:
hyperparameters:
  # The PNG of this one case, named by it (the columns: configs/evaluation/viz/views_casos_mar.yaml).
  render_views:
    case_name: ${CASE_KEY}

  # ---------------------------------------------------------------------
  # The per-model chamfer prior, the one thing that cannot be shared.
  #
  # `mahalanobis` is the model's own Gaussian prior: alpha ~ N(0, Lambda), so
  # the penalty sum(alpha_i^2 / lambda_i) is its negative log density. This
  # project stores the UNWHITENED alpha (the basis is normalised and does not
  # absorb sqrt(Lambda) - see src/models/gpmm/model/model.py::reconstruct), which is why
  # the isotropic prior is not the matching one here: with normalize:true this
  # is exactly an isotropic penalty on the whitened z_i = alpha_i/sqrt(lambda_i).
  #
  # Each weight is solved from the closed form in
  # theory/shape_deformation_models.tex, "Expected chi2_crit through
  # MAP-estimation": under u = Psi Lam^1/2 z + eps with eps ~ N(0, sn^2 I),
  #
  #     E[||z||^2 | u] = ||z_hat||^2 + tr(Sigma_z)
  #
  # which falls monotonically in sn^2 from ||z_ML||^2 to L. The weight below is
  # the root of E[||z||^2 | u] = chi2.ppf(0.99, L) - the same 99% ellipsoid the
  # `clamped` fit's mahalanobis_clamp enforces - converted to this config's
  # units by w = sn^2 / (lambda_max * P), where P is the matched-pair count:
  # the closed form assumes a SUMMED likelihood, and both losses here average,
  # which scales the data term by 1/P and the prior weight with it. So each
  # model is regularised exactly enough that its EXPECTED plausibility radius,
  # posterior variance included, sits on the 99% level rather than past it.
  #
  # map_<n>x is n TIMES THE CALIBRATED WEIGHT for that model, not a weight of n:
  # map_1x is the solved value below, and the sweep brackets it 0.25x .. 4x. A
  # literal weight of 1.0 would be a different reference - under normalize:true
  # it restrains the dominant mode exactly as isotropic weight 1 would - and has
  # no reason to coincide with the MAP value, which is set by the scan noise.
  #
  # The weights are not comparable between models: they depend on L, on the
  # eigenvalue spectrum and on the domain's units. Calibrated on subject 2's
  # merged scan - the only preprocessed subject - so re-run the calibration if
  # the preprocessing or the scan set changes.
  # ---------------------------------------------------------------------

  # Shared by every ssm_posterior id without a block of its own. The noise
  # kwargs are in recon_dist_2_target's units (mm). logistic observes every
  # vertex, with a weight 1/sigma^2 that falls to 1/sigma_max^2 around
  # threshold; cutoff observes only the vertices below threshold.
  ssm_posterior: &ssm_posterior
    error_array: recon_dist_2_target
    noise:
      name: logistic
      kwargs: {sigma: 0.5, sigma_max: 100.0, threshold: 2.0, width: 0.5}
    include_model_noise: true
    n_samples: 5
    seed: 0

  ssm_posterior_baby_mean_lddmm_cutoff:
    <<: *ssm_posterior
    noise:
      name: cutoff
      kwargs: {sigma: 0.5, threshold: 2.0}

  # baby_mean = the run above + designed deformation modes (resnet_flow/fields/modes.py),
  # drawn in scripts/GUIs/edit_deformation_modes.py. The network's motion pays
  # kinetic_weight as always; the modes' motion pays discount x kinetic_weight, so a
  # small discount makes "widen the nose this way" much cheaper than any other way of
  # moving the same tissue. Logged as modes/<name>_mm (~ peak displacement) and
  # mode_kinetic; deformation_modes_source.vtp shows each field on the template.
  # Delete the modes block (or this whole entry) for the plain run.
  #resnet_lddmm_train_baby_mean:
  #  <<: *resnet_lddmm_train
  #  field:
  #    <<: *resnet_lddmm_field
  #    modes:
  #      spec: ${PROJECT_ROOT}/assets/templates/deformation_modes/baby_mean.yaml
  #      template: ${PROJECT_ROOT}/assets/templates/baby_mean.vtp   # the source must be a posed copy of it
  #      names: [ mode_alar_strain]
  #      discount: 0.000002     # 1 = no cheaper than the network, 0 = free; 0.02 = 50x cheaper
  #      lr: 0.05           # amplitude learning rate: mm of peak displacement per step
  #      # After training: <output_dir>/mode_decomposition/ - the flow split into network and modes.
  #      # trajectories = end shapes + every Euler step (~150 MB), ends = end shapes only, none = skip
  #      decompose: trajectories

