# Baseline: the BabyFM PCA point-distribution model.
# This is the comparison model for the GPMM variants.
domain:
  source: ${PROJECT_ROOT}/src/SSM/BabyFM/BabyFaceModel.mat
  metric: euclidean
  mass: true

normalize: false
kernel:
  name: pca
truncation:
  n_components: 163
  variance_threshold: 1.0
approximation:
  name: exact_factor
# PCA has no analytic off-domain kernel. Keep the baseline build independent
# of the optional VTK interpolation dependency.
inference:
  name: none
output:
  dir: ${PROJECT_ROOT}/outputs/gpmm/pca
  filename: babyfm_pca.npz
