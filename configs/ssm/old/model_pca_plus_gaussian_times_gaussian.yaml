# Nested product: (pca + g1) * g2.
# First add a smooth deformation term to PCA, then localize the combined
# covariance with a second Gaussian envelope.
domain:
  # source: ${PROJECT_ROOT}/src/SSM/BabyFM/BabyFaceModel.mat
  source: ${PROJECT_ROOT}/src/SSM/FetusModel_x4
  metric: euclidean
  mass: true

normalize: false
kernel:
  name: product
  children:
    - name: sum
      children:
        - name: pca
        - name: gaussian
          kwargs:
            sigma: 5
            scale: 1.0
    - name: gaussian
      kwargs:
        sigma: 5.0
        scale: 1.0
truncation:
  n_components: 300
  variance_threshold: 0.99
approximation:
  name: pivoted_cholesky
  kwargs:
    max_rank: 300
    tolerance: 1.0e-3
inference:
  name: none
output:
  dir: ${PROJECT_ROOT}/outputs/gpmm/pca_plus_gaussian_times_gaussian
  filename: fetus_pca_plus_gaussian_times_gaussian.npz
