# PCA covariance locally modulated by a radial basis function.
# Product is block-scaled by the scalar Gaussian and preserves PCA's
# within-vertex x/y/z covariance.
domain:
 # source: ${PROJECT_ROOT}/src/SSM/BabyFM/BabyFaceModel.mat
  source: ${PROJECT_ROOT}/src/SSM/FetusModel_x4
  metric: euclidean
  mass: true

normalize: false
kernel:
  name: product
  children:
    - name: pca
    - name: gaussian
      kwargs:
        sigma: 5
        scale: 1.0
truncation:
  n_components: 300
  variance_threshold: 0.99
approximation:
  name: pivoted_cholesky
  kwargs:
    max_rank: 300
    tolerance: 1.0e-3
# A product containing the tabulated PCA kernel has no analytic value away
# from the source vertices. It is still fully usable on this mesh; continuous
# evaluation needs a separate barycentric inference strategy.
inference:
  name: none
output:
  dir: ${PROJECT_ROOT}/outputs/gpmm/pca_product_gaussian
  filename: fetus_pca_product_gaussian.npz
