# Nested, read left to right: (pca + gaussian) * gaussian.
# Add a smooth term to PCA first, then localize the combined covariance.
#
# Domain: FetusModel_x4, bounding-box diagonal 101.108, 5743 vertices, 183 PCA modes,
# mean per-coordinate PCA variance 1.449.
#   The atlas's own deformation width is a floor on any length scale here:
#   params.json says kwd 7.0, i.e. 7/sqrt(2) = 4.95 in this codebase's
#   exp(-d^2/2 sigma^2) convention.
#   The inner gaussian is a summand, so its scale is a variance:
#     sigma 25.0 (smooth, 25% of the diagonal), scale 1.449 = 1x PCA variance.
#   The outer gaussian is the envelope, so it block-scales and stays neutral:
#     sigma 15.0 (local, 15% of the diagonal), scale 1.0.
domain:
  source: ${PROJECT_ROOT}/src/SSM/FetusModel_x4
  metric: euclidean
  mass: true

normalize: false
kernel:
  name: product
  children:
    - name: sum
      children:
        - name: pca
        - name: gaussian
          kwargs:
            sigma: 25.0
            scale: 1.449
    - name: gaussian
      kwargs:
        sigma: 5.0
        scale: 1.0
truncation:
  n_components: 300
  variance_threshold: 0.99
approximation:
  # 17229 rows is past DENSE_ROW_LIMIT, so dense_eigh is not an option.
  name: pivoted_cholesky
  kwargs:
    max_rank: 300
    tolerance: 1.0e-3
inference:
  name: none
output:
  dir: ${PROJECT_ROOT}/src/SSM/saved_models/fetus
  filename: fetus_pca_sum_gaussian_times_gaussian.npz
