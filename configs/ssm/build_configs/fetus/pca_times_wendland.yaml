# Localized GPMM: pca * wendland.
# The scalar kernel block-scales each 3x3 PCA block, shortening the range
# of every PCA mode while preserving its within-vertex x/y/z covariance.
# Compactly supported and C^2 - the only genuinely sparse kernel here, and a hard cutoff rather than a decay rate.
#
# Domain: FetusModel_x4, bounding-box diagonal 101.108, 5743 vertices, 183 PCA modes,
# mean per-coordinate PCA variance 1.449.
#   The atlas's own deformation width is a floor on any length scale here:
#   params.json says kwd 7.0, i.e. 7/sqrt(2) = 4.95 in this codebase's
#   exp(-d^2/2 sigma^2) convention.
#   radius 36.7 = the local length scale (15% of the diagonal), matched to
#   gaussian(sigma=15.0) at correlation 0.05.
#   scale 1.0 is the neutral value for a product child: it modulates
#   correlation and leaves the per-vertex PCA variance untouched.
domain:
  source: ${PROJECT_ROOT}/src/SSM/FetusModel_x4
  metric: euclidean
  mass: true

normalize: false
kernel:
  name: product
  children:
    - name: pca
    - name: wendland
      kwargs:
        radius: 36.7
        scale: 1.0
truncation:
  n_components: 300
  variance_threshold: 0.99
approximation:
  # 17229 rows is past DENSE_ROW_LIMIT, so dense_eigh is not an option.
  name: pivoted_cholesky
  kwargs:
    max_rank: 300
    tolerance: 1.0e-3
inference:
  name: none
output:
  dir: ${PROJECT_ROOT}/src/SSM/saved_models/fetus
  filename: fetus_pca_times_wendland.npz
