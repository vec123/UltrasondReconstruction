# Strictly regional GPMM: localized(pca).
# The population's own deformation, confined to a stated region and frozen
# outside it - w(x) k_pca(x,y) w(y). Every sample is population-plausible (the
# directions are still PCA's) but only the region moves.
#
# The sibling pca_sum_localized_gaussian adds regional freedom BESIDE the full
# model; this one SUBTRACTS everything outside the region. Use this when the
# rest of the shape is already fixed - fitting a nose onto an otherwise settled
# head - and the sum when the whole shape is still free.
#
# Cheap by construction: a diagonal congruence changes no rank, so localising
# the 183-mode pca kernel gives a 183-mode kernel and 'exact_factor' still
# applies. Compare pca_times_gaussian, whose Khatri-Rao factor is 183 x 300.
#
# Domain: FetusModel_x4, bounding-box diagonal 101.1 mm, 5743 vertices,
# 183 PCA modes, mean per-coordinate PCA variance 1.449.
domain:
  source: ${PROJECT_ROOT}/src/SSM/FetusModel_x4
  metric: euclidean
  mass: true

normalize: false
kernel:
  name: localized
  kwargs:
    weights: ${PROJECT_ROOT}/Templates/fetus_mean.vtp
    weights_field: heatmap_landmarks
  children:
    - name: pca
truncation:
  # The congruence preserves rank, so all 183 modes survive it.
  n_components: 183
  variance_threshold: 1.0
approximation:
  name: exact_factor
inference:
  name: none
output:
  dir: ${PROJECT_ROOT}/src/SSM/saved_models/fetus
  filename: fetus_pca_localized.npz
